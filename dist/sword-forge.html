}`;

  SRC.particleVS = `
attribute vec3 aCenter; attribute vec2 aCorner; attribute vec2 aSizeRot; attribute vec4 aColor; attribute vec2 aEmitTex;
uniform mat4 uVP; uniform vec3 uRight; uniform vec3 uUp;
varying vec2 vUV; varying vec4 vColor; varying float vEmit;
void main() {
  float cr = cos(aSizeRot.y), sr = sin(aSizeRot.y);
  vec2 c = vec2(cr * aCorner.x - sr * aCorner.y, sr * aCorner.x + cr * aCorner.y);
  vec3 wp = aCenter + (uRight * c.x + uUp * c.y) * aSizeRot.x * 0.5;
  vUV = vec2((aCorner.x * 0.5 + 0.5 + aEmitTex.y) / 4.0, 1.0 - (aCorner.y * 0.5 + 0.5));
  vColor = aColor;
  vEmit = aEmitTex.x;
  gl_Position = uVP * vec4(wp, 1.0);
}`;
  SRC.particleFS = PREC + `
varying vec2 vUV; varying vec4 vColor; varying float vEmit;
uniform sampler2D uAtlas;
void main() {
  vec4 t = texture2D(uAtlas, vUV);
  float a = t.a * vColor.a;
  gl_FragColor = vec4(vColor.rgb * a, a * (1.0 - vEmit));
}`;

  SRC.ribbonVS = `
attribute vec3 aPos; attribute vec4 aCol;
uniform mat4 uVP;
varying vec4 vCol;
void main() { vCol = aCol; gl_Position = uVP * vec4(aPos, 1.0); }`;
  SRC.ribbonFS = PREC + `
varying vec4 vCol; uniform float uEmit;
void main() { gl_FragColor = vec4(vCol.rgb * vCol.a, vCol.a * (1.0 - uEmit)); }`;

  SRC.quadVS = `
attribute vec2 aPos; varying vec2 vUV;
void main() { vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
  SRC.bgFS = PREC + `
varying vec2 vUV;
uniform vec3 uTop, uBottom, uGlow; uniform vec2 uGlowPos; uniform float uGlowAmt, uAspect;
void main() {
  vec3 c = mix(uBottom, uTop, smoothstep(0.0, 1.0, vUV.y));
  vec2 d = (vUV - uGlowPos) * vec2(uAspect, 1.0);
  float g = exp(-dot(d, d) * 7.0);
  c += uGlow * g * uGlowAmt;
  float v = distance(vUV, vec2(0.5, 0.55));
  c *= 1.0 - smoothstep(0.35, 0.95, v) * 0.5;
  gl_FragColor = vec4(c, 1.0);
}`;
  SRC.brightFS = PREC + `
varying vec2 vUV; uniform sampler2D uTex; uniform float uThreshold;
void main() {
  vec3 c = texture2D(uTex, vUV).rgb;
  float l = max(c.r, max(c.g, c.b));
  float k = smoothstep(uThreshold, uThreshold + 0.25, l);
  gl_FragColor = vec4(c * k, 1.0);
}`;
  SRC.blurFS = PREC + `
varying vec2 vUV; uniform sampler2D uTex; uniform vec2 uDir;
void main() {
  vec3 s = texture2D(uTex, vUV).rgb * 0.2270270270;
  s += (texture2D(uTex, vUV + uDir * 1.3846153846).rgb + texture2D(uTex, vUV - uDir * 1.3846153846).rgb) * 0.3162162162;
  s += (texture2D(uTex, vUV + uDir * 3.2307692308).rgb + texture2D(uTex, vUV - uDir * 3.2307692308).rgb) * 0.0702702703;
  gl_FragColor = vec4(s, 1.0);
}`;
  SRC.compositeFS = PREC + `
varying vec2 vUV; uniform sampler2D uScene, uBloom; uniform float uBloomAmt, uGrain;
void main() {
  vec3 c = texture2D(uScene, vUV).rgb;
  vec3 b = texture2D(uBloom, vUV).rgb;
  c += b * uBloomAmt;
  c = c / (1.0 + max(c - 1.0, 0.0) * 0.55);
  c += (fract(sin(dot(vUV * 913.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * uGrain;
  gl_FragColor = vec4(c, 1.0);
}`;
  SRC.groundVS = `
attribute vec2 aPos; uniform mat4 uVP; uniform float uSize; varying vec2 vW;
void main() { vec2 w = aPos * uSize; vW = w; gl_Position = uVP * vec4(w.x, 0.0, w.y, 1.0); }`;
  SRC.groundFS = PREC + `
varying vec2 vW; uniform vec3 uTint; uniform vec3 uShadow; uniform float uRadius;
void main() {
  float r = length(vW);
  float disc = 1.0 - smoothstep(uRadius - 1.5, uRadius, r);
  vec2 g = abs(fract(vW / 2.0 + 0.5) - 0.5) / fwidth(vW / 2.0);
  float line = 1.0 - clamp(min(g.x, g.y), 0.0, 1.0);
  float ring = (1.0 - smoothstep(0.0, 0.07, abs(r - uRadius + 0.7))) * 0.8;
  float ring2 = (1.0 - smoothstep(0.0, 0.05, abs(r - uRadius * 0.55))) * 0.35;
  float sh = 1.0 - smoothstep(0.0, 1.0, length((vW - uShadow.xy) / vec2(uShadow.z, uShadow.z * 0.7)));
  vec3 base = uTint * (0.5 + 0.5 * (1.0 - r / uRadius));
  vec3 col = base + uTint * (line * 0.22 + ring + ring2);
  col *= 1.0 - sh * 0.75;
  float a = disc * (0.78 + 0.1 * line + 0.2 * ring);
  gl_FragColor = vec4(col, a);
}`;

  function compile(gl, type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error('Shader compile failed: ' + gl.getShaderInfoLog(sh));
    }
    return sh;
  }
  function program(gl, vs, fs, attribs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
    attribs.forEach((a, i) => gl.bindAttribLocation(p, i, a));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Program link failed: ' + gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i);
      u[info.name] = gl.getUniformLocation(p, info.name);
    }
    return { p, u, attribs };
  }

  /* ------------------------------------------------------ particle sprite atlas */
  function makeAtlas() {
    const T = 128;
    const c = document.createElement('canvas');
    c.width = T * 4; c.height = T;
    const g = c.getContext('2d');
    const rg = (x, y, r, stops) => {
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      stops.forEach(([o, a]) => gr.addColorStop(o, `rgba(255,255,255,${a})`));
      return gr;
    };
    // 0: sparkle (4-point star)
    {
      const ox = 0, cx = ox + T / 2, cy = T / 2;
      g.fillStyle = rg(cx, cy, T * 0.42, [[0, 0.95], [0.18, 0.55], [0.5, 0.14], [1, 0]]);
      g.fillRect(ox, 0, T, T);
      [[1, 0], [0, 1]].forEach(([dx, dy]) => {
        const a = T * 0.48, w = 4.5;
        const gr = g.createLinearGradient(cx - dx * a, cy - dy * a, cx + dx * a, cy + dy * a);
        gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
        g.save();
        g.fillStyle = gr;
        g.beginPath();
        g.moveTo(cx - dx * a, cy - dy * a);
        g.lineTo(cx + dy * w, cy + dx * w);
        g.lineTo(cx + dx * a, cy + dy * a);
        g.lineTo(cx - dy * w, cy - dx * w);
        g.closePath();
        g.fill();
        g.restore();
      });
    }
    // 1: smoke puff
    {
      const ox = T, rnd = (() => { let s = 7; return () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646; })();
      g.save(); g.beginPath(); g.rect(ox, 0, T, T); g.clip();
      for (let i = 0; i < 16; i++) {
        const a = rnd() * Math.PI * 2, d = rnd() * T * 0.2;
        const x = ox + T / 2 + Math.cos(a) * d, y = T / 2 + Math.sin(a) * d, r = T * (0.2 + rnd() * 0.18);
        g.fillStyle = rg(x, y, r, [[0, 0.32], [0.6, 0.14], [1, 0]]);
        g.fillRect(ox, 0, T, T);
      }
      g.restore();
    }
    // 2: flame
    {
      const ox = T * 2;
      g.save(); g.beginPath(); g.rect(ox, 0, T, T); g.clip();
      g.fillStyle = rg(ox + T / 2, T * 0.62, T * 0.4, [[0, 0.95], [0.5, 0.5], [1, 0]]);
      g.fillRect(ox, 0, T, T);
      g.beginPath();
      g.moveTo(ox + T * 0.5, T * 0.04);
      g.bezierCurveTo(ox + T * 0.78, T * 0.36, ox + T * 0.86, T * 0.62, ox + T * 0.5, T * 0.92);
      g.bezierCurveTo(ox + T * 0.14, T * 0.62, ox + T * 0.22, T * 0.36, ox + T * 0.5, T * 0.04);
      g.closePath();
      g.fillStyle = rg(ox + T / 2, T * 0.64, T * 0.44, [[0, 0.9], [0.55, 0.45], [1, 0]]);
      g.fill();
      g.restore();
    }
    // 3: soft dot
    {
      const ox = T * 3;
      g.fillStyle = rg(ox + T / 2, T / 2, T * 0.5, [[0, 1], [0.25, 0.7], [0.6, 0.18], [1, 0]]);
      g.fillRect(ox, 0, T, T);
    }
    return c;
  }

  /* ------------------------------------------------------------------ Renderer */
  class Renderer {
    constructor(canvas, opts) {
      opts = opts || {};
      const attrs = { antialias: false, alpha: false, depth: true, stencil: false, preserveDrawingBuffer: !!opts.preserve, powerPreference: 'high-performance' };
      const gl = canvas.getContext('webgl', attrs) || canvas.getContext('experimental-webgl', attrs);
      if (!gl) throw new Error('WebGL is not available');
      this.gl = gl;
      this.canvas = canvas;
      this.ext = gl.getExtension('OES_standard_derivatives');
      this.maxParticles = 3600;
      this.flipWedge = false;
      this.init();
    }

    init() {
      const gl = this.gl;
      this.progs = {
        mesh: program(gl, SRC.meshVS, SRC.meshFS, ['aPos', 'aNrm']),
        particle: program(gl, SRC.particleVS, SRC.particleFS, ['aCenter', 'aCorner', 'aSizeRot', 'aColor', 'aEmitTex']),
        ribbon: program(gl, SRC.ribbonVS, SRC.ribbonFS, ['aPos', 'aCol']),
        bg: program(gl, SRC.quadVS, SRC.bgFS, ['aPos']),
        bright: program(gl, SRC.quadVS, SRC.brightFS, ['aPos']),
        blur: program(gl, SRC.quadVS, SRC.blurFS, ['aPos']),
        composite: program(gl, SRC.quadVS, SRC.compositeFS, ['aPos']),
      };
      // the ground uses fwidth() for crisp grid lines when the extension exists
      const gfs = (this.ext ? '#extension GL_OES_standard_derivatives : enable\n' : '') + SRC.groundFS.replace(/fwidth\(vW \/ 2\.0\)/, this.ext ? 'fwidth(vW / 2.0)' : 'vec2(0.03)');
      this.progs.ground = program(gl, SRC.groundVS, gfs, ['aPos']);

      const upload = (data) => {
        const b = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
        return b;
      };
      const meshBuf = (m) => {
        const ib = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.idx, gl.STATIC_DRAW);
        return { pos: upload(m.pos), nrm: upload(m.nrm), idx: ib, count: m.idx.length };
      };
      this.meshes = {
        box: meshBuf(boxMesh()),
        wedge: meshBuf(wedgeMesh(false)),
        wedgeFlip: meshBuf(wedgeMesh(true)),
        cyl: meshBuf(cylinderMesh(32)),
        sphere: meshBuf(sphereMesh(16, 28)),
      };
      this.quad = upload(new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]));

      // particles: dynamic quad buffer
      this.pData = new Float32Array(this.maxParticles * 4 * 13);

    }
    copyPose(a, b) {
      SF.ANIM_CH3.forEach((ch) => { for (let i = 0; i < 3; i++) b[ch][i] = a[ch][i]; });
      b.dy = a.dy; b.dz = a.dz;
    }

    /* the next hit of the combo (or the plain swing when the sword has no moves) */
    swing() {
      const an = this.anim;
      if (this.mv && this.mv.kind === 'swing' && this.mv.t * this.speed / this.mv.r.dur < 0.5) return;
      if (!an || !an.on || !an.swings.length) { this.startMove(DEFAULT_MOVE, 'swing', true); return; }
      const id = an.swings[this.combo % an.swings.length];
      this.combo++;
      this.startMove(SF.resolveMove(id), 'swing');
    }
    playMove(id) {
      const r = SF.resolveMove(id);
      if (!r || r.kind === 'idle') return;
      this.startMove(r, r.kind);
    }

    /* body pose for this frame: the playing move, or the idle stance, cross-faded */
    updatePose(dt) {
      let target;
      const mv = this.mv;
      if (mv) {
        mv.t += dt * this.speed;
        const u = mv.t / mv.r.dur;
        if (u >= 1) { this.mv = null; this.swingOn = false; this.blend = { from: SF.zeroPose(), t: 0, dur: 0.18 }; this.copyPose(this.pose, this.blend.from); }
        else {
          target = SF.poseAt(mv.r, u);
          if (mv.kind === 'swing') {
            const h = mv.r.hit;
            if (!mv.burst && u >= h[0]) { mv.burst = true; this.pending.burst = true; }
            if (!mv.struck && u >= h[0] + (h[1] - h[0]) * 0.35) { mv.struck = true; this.pending.hit = true; }
            this.swingOn = u >= h[0] - 0.04 && u <= h[1] + 0.08;
          }
        }
      }
      if (!target) {
        target = this.idleR ? SF.poseAt(this.idleR, (this.t / this.idleR.dur) % 1) : SF.zeroPose();
        if (!this.idleR) target.ra[0] = Math.sin(this.t * 1.7) * 1.0;   // a tiny hand bob
      }
      const bl = this.blend;
      if (bl && bl.t < bl.dur) {
        bl.t += dt;
        const w = Math.min(1, bl.t / bl.dur);
        SF.blendPose(bl.from, target, w * w * (3 - 2 * w), this.pose);
      } else {
        this.copyPose(target, this.pose);
      }
    }

    /* sword placement in the world (follows the right hand) */
    updateTransform() {
      const tilt = this.tilt * D2R;
      if (this.thumb) {
        this.xf = { R: M.rotX(-tilt), p: [0, -(this.swordTop + this.swordBottom) / 2, 0] };
        return;
      }
      const ps = this.pose;
      const Rt = M.eulerToMat(ps.to), Rd = M.eulerToMat(ps.ra);
      const RtRd = M.mul3(Rt, Rd);
      const sh = this.upper(PIV.ra);
      const off = M.mulV(RtRd, V.sub(GRIP0, PIV.ra));
      const R = M.mul3(RtRd, M.mul3(M.eulerToMat(ps.wr), M.rotX(-tilt)));            // wr: the wrist turns the sword in the hand
      this.xf = { R, p: V.add(sh, off) };
    }
    /* a point on the upper body after the root offset and the torso turn */
    upper(p) {
      const ps = this.pose;
      const Rt = M.eulerToMat(ps.to);
      const q = M.mulV(Rt, V.sub(p, WAIST));
      return [WAIST[0] + q[0], WAIST[1] + q[1] + ps.dy, WAIST[2] + q[2] + ps.dz];
    }

    toWorld(lp, sc) {
      const s = sc == null ? 1 : sc;
      const q = M.mulV(this.xf.R, [lp[0] * s, lp[1] * s, lp[2] * s]);
      return [this.xf.p[0] + q[0], this.xf.p[1] + q[1], this.xf.p[2] + q[2]];
    }

    spawn(e, mode) {
      if (this.particles.length >= 3000) return;
      const d = e.d, r = this.rand;
      let lp;
      if (mode === 'hit') lp = this.model.tip;
      else if (d.where === 'tip') lp = this.model.tip;
      else if (d.where === 'hilt') lp = this.model.hilt;
      else lp = this.model.sample.blade(r);
      if (d.where !== 'blade' || mode === 'hit') lp = [lp[0] + (r() - 0.5) * 0.12, lp[1] + (r() - 0.5) * 0.12, lp[2] + (r() - 0.5) * 0.12];
      // random direction inside a cone around the blade axis
      const spread = (mode === 'hit' ? Math.max(d.spread[0], 140) : d.spread[0]) * D2R;
      const cz = 1 - r() * (1 - Math.cos(Math.min(spread, Math.PI)));
      const sz = Math.sqrt(Math.max(0, 1 - cz * cz)), ph = r() * Math.PI * 2;
      const dirL = [sz * Math.cos(ph), cz, sz * Math.sin(ph)];
      const speed = d.speed[0] + (d.speed[1] - d.speed[0]) * r();
      const life = d.lifetime[0] + (d.lifetime[1] - d.lifetime[0]) * r();
      const p = {
        d, tex: e.tex, age: 0, life, locked: d.locked && mode !== 'hit',
        rot: (d.rot[0] + (d.rot[1] - d.rot[0]) * r()) * D2R, rs: (d.rotSpeed[0] + (d.rotSpeed[1] - d.rotSpeed[0]) * r()) * D2R,
        x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,
      };
      if (p.locked) {
        p.x = lp[0]; p.y = lp[1]; p.z = lp[2];
        p.vx = dirL[0] * speed; p.vy = dirL[1] * speed; p.vz = dirL[2] * speed;
      } else {
        const w = this.toWorld(lp);
        const v = M.mulV(this.xf.R, dirL);
        p.x = w[0]; p.y = w[1]; p.z = w[2];
        p.vx = v[0] * speed; p.vy = v[1] * speed; p.vz = v[2] * speed;
      }
      this.particles.push(p);
    }

    spawnArc(a) {
      const r = this.rand, d = a.d;
      const A = this.model.trail.a, B = this.model.trail.b;
      const n = 13;
      const side = (r() - 0.5) * 0.3;
      for (let i = 0; i <= n; i++) {
        const f = i / n;
        const env = Math.sin(f * Math.PI);
        const px = A[0] + (B[0] - A[0]) * f + (r() - 0.5) * 0.5 * d.amp * env;
        const py = A[1] + (B[1] - A[1]) * f;
        const pz = A[2] + (B[2] - A[2]) * f + (r() - 0.5) * 0.6 * d.amp * env + side * env;
        this.particles.push({
          d: ARC_DESC, tex: 3, age: 0, life: 0.07 + r() * 0.05, locked: true, rot: 0, rs: 0,
          x: px, y: py, z: pz, vx: 0, vy: 0, vz: 0, tint: d.color,
        });
      }
    }

    update(dt) {
      if (!this.model) return;
      this.t += dt;
      if (this.equipT < 1) this.equipT = Math.min(1, this.equipT + dt / 0.5);
      this.updatePose(dt);
      this.updateTransform();
      const swinging = this.swingOn;
      const sw = this.swingOn ? 1 : -1;

      // emitters
      this.emitters.forEach((e) => {
        const d = e.d;
        if ((d.trigger === 'idle') || (d.trigger === 'swing' && swinging)) {
          e.acc += d.rate * dt;
          while (e.acc >= 1) { e.acc -= 1; this.spawn(e); }
        }
      });
      if (this.pending.burst) { this.emitters.forEach((e) => { if (e.d.trigger === 'burst') for (let i = 0; i < e.d.count; i++) this.spawn(e); }); }
      if (this.pending.hit) { this.emitters.forEach((e) => { if (e.d.trigger === 'hit') for (let i = 0; i < e.d.count; i++) this.spawn(e, 'hit'); }); }
      if (this.pending.equip) { this.emitters.forEach((e) => { if (e.d.trigger === 'equip') for (let i = 0; i < e.d.count; i++) this.spawn(e); }); }
      this.pending.burst = this.pending.hit = this.pending.equip = false;
      this.arcs.forEach((a) => {
        a.acc += dt * a.d.speed;
        while (a.acc >= 1) { a.acc -= 1; for (let i = 0; i < a.d.count; i++) this.spawnArc(a); }
      });

      // particles
      const list = this.particles;
      for (let i = list.length - 1; i >= 0; i--) {
        const p = list[i];
        p.age += dt;
        if (p.age >= p.life) { list[i] = list[list.length - 1]; list.pop(); continue; }
        const d = p.d;
        if (!p.locked) { p.vx += d.accel[0] * dt; p.vy += d.accel[1] * dt; p.vz += d.accel[2] * dt; }
        const k = Math.exp(-d.drag * dt);
        p.vx *= k; p.vy *= k; p.vz *= k;
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        p.rot += p.rs * dt;
      }

      // trail
      if (this.trailFx) {
        const active = this.trailFx.always || (sw >= 0 && swinging);
        if (active && !this.trailActive) this.trailSeg++;
        this.trailActive = active;
        if (active) {
          if (!this.trail) this.trail = [];
          this.trail.push({ a: this.toWorld(this.model.trail.a), b: this.toWorld(this.model.trail.b), t: this.t, seg: this.trailSeg });
        }
        if (this.trail) {
          const life = this.trailFx.life;
          while (this.trail.length && this.t - this.trail[0].t > life) this.trail.shift();
        }
      }
    }

    /* build everything the renderer needs for this frame */
    frame(cam, aspect) {
      const sc = 0.8 + 0.2 * (1 - Math.pow(1 - this.equipT, 3)) * (1 + 0.12 * Math.sin(this.equipT * Math.PI));
      const parts = [];
      const eye = cam.eye, fwd = V.norm(V.sub(cam.target, eye));
      const R_s = this.xf.R;
      const hue = this.hasRainbow ? hsv((this.t * this.rainbowSpeed) % 1, 0.85, 1) : null;
      const pulseGlow = this.glow && this.glow.pulse > 0 ? 0.7 + 0.3 * Math.sin(this.t * this.glow.pulse * 2 * Math.PI) : 1;

      this.parts.forEach((p) => {
        const R = M.mul3(R_s, p.Rl);
        const q = M.mulV(R_s, [p.lp[0] * sc, p.lp[1] * sc, p.lp[2] * sc]);
        const pos = [this.xf.p[0] + q[0], this.xf.p[1] + q[1], this.xf.p[2] + q[2]];
        let alpha = p.alpha;
        if (p.auraPulse > 0) alpha = Math.min(1, Math.max(0, alpha + 0.18 * Math.sin(this.t * p.auraPulse * 2 * Math.PI)));
        const color = hue && p.rainbow ? hue : p.color;
        parts.push({
          mesh: p.mesh, pos, rotCol: toCol3(R), size: [p.size[0] * sc, p.size[1] * sc, p.size[2] * sc], color,
          spec: p.look.spec, shin: p.look.shin, metal: p.look.metal, emit: Math.max(p.look.emit, 0), alpha,
          rim: 0.12 + 0.3 * p.look.spec, outline: this.outline && p.role !== 'aura',
          depth: V.dot(V.sub(pos, eye), fwd),
        });
      });

      if (this.avatar) {
        const ps = this.pose;
        const Rt = M.eulerToMat(ps.to);
        const R = {
          he: M.mul3(Rt, M.eulerToMat(ps.he)),
          ra: M.mul3(Rt, M.mul3(M.eulerToMat(ps.ra), HOLD)),
          la: M.mul3(Rt, M.eulerToMat(ps.la)),
          rl: M.eulerToMat(ps.rl),                // the legs keep their own turn: the hips cancel the torso
          ll: M.eulerToMat(ps.ll),
          to: Rt,
        };
        AVATAR.forEach((a) => {
          let pos, rot = R[a.g];
          if (a.g === 'to') pos = this.upper(a.pos);
          else {
            const pv = PIV[a.g];
            pos = V.add(this.upper(pv), M.mulV(rot, V.sub(a.pos, pv)));
          }
          parts.push({ mesh: a.mesh, pos, rotCol: toCol3(rot), size: a.size, color: a.color, spec: a.spec, shin: a.shin, metal: 0, emit: 0, alpha: 1, rim: a.rim, depth: V.dot(V.sub(pos, eye), fwd) });
        });
      }

      // glow light
      let point = null;
      if (this.glow) {
        const g = this.glow;
        const mid = this.toWorld(this.model.mid);
        const col = hue || g.color.map((v) => v / 255);
        const k = Math.min(1.1, g.brightness * 0.2) * pulseGlow;
        point = { pos: mid, col: [col[0] * k, col[1] * k, col[2] * k], range: Math.max(5, g.range * 0.55) };
      }

      // particles -> packed quads
      const right = [cam.view[0], cam.view[4], cam.view[8]];
      const up = [cam.view[1], cam.view[5], cam.view[9]];
      const data = cam.particleData;
      let n = 0;
      const tmp = [0, 0, 0];
      const list = this.particles;
      const CORN = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
      for (let i = 0; i < list.length && n < 3500; i++) {
        const p = list[i], d = p.d;
        const u = p.age / p.life;
        let x = p.x, y = p.y, z = p.z;
        if (p.locked) { const w = this.toWorld([x, y, z], sc); x = w[0]; y = w[1]; z = w[2]; }
        const size = seqAt(d.size, u);
        if (size <= 0.0005) continue;
        let r, g, b;
        if (p.tint) { r = p.tint[0] / 255; g = p.tint[1] / 255; b = p.tint[2] / 255; } else { colAt(d.color, u, tmp); r = tmp[0]; g = tmp[1]; b = tmp[2]; }
        if (hue && !p.tint && d.style === 'rainbow') { /* keep the gradient */ }
        const a = 1 - seqAt(d.transparency, u);
        const rot = p.rot;
        const off = n * 52;
        for (let c = 0; c < 4; c++) {
          const o = off + c * 13;
          data[o] = x; data[o + 1] = y; data[o + 2] = z;
          data[o + 3] = CORN[c][0]; data[o + 4] = CORN[c][1];
          data[o + 5] = size; data[o + 6] = rot;
          data[o + 7] = r; data[o + 8] = g; data[o + 9] = b; data[o + 10] = a;
          data[o + 11] = d.emission; data[o + 12] = p.tex;
        }
        n++;
      }

      // trail ribbons
      const ribbons = [];
      if (this.trailFx && this.trail && this.trail.length > 1) {
        const fx = this.trailFx;
        const bySeg = {};
        this.trail.forEach((pt) => { (bySeg[pt.seg] = bySeg[pt.seg] || []).push(pt); });
        Object.values(bySeg).forEach((pts) => {
          if (pts.length < 2) return;
          const buf = new Float32Array(pts.length * 2 * 7);
          let c = 0;
          const col = [0, 0, 0];
          for (let i = pts.length - 1; i >= 0; i--) {          // newest first
            const pt = pts[i];
            const u = Math.min(1, (this.t - pt.t) / fx.life);
            colAt(fx.color, u, col);
            const cc = hue || col;
            const a = Math.max(0, 1 - seqAt(fx.transparency, u));
            const w = Math.max(0.0, seqAt(fx.width, u));
            const mid = [(pt.a[0] + pt.b[0]) / 2, (pt.a[1] + pt.b[1]) / 2, (pt.a[2] + pt.b[2]) / 2];
            for (let s = 0; s < 2; s++) {
              const e = s === 0 ? pt.a : pt.b;
              buf.set([mid[0] + (e[0] - mid[0]) * w, mid[1] + (e[1] - mid[1]) * w, mid[2] + (e[2] - mid[2]) * w, cc[0], cc[1], cc[2], a], c * 7);
              c++;
            }
          }
          ribbons.push({ data: buf, count: c, emit: fx.glow });
        });
      }

      const L = {
        dir: V.norm([-0.55, 0.85, -0.5]), col: [1.0, 0.95, 0.88], sky: [0.34, 0.4, 0.52], ground: [0.1, 0.1, 0.13],
      };
      return {
        vp: cam.vp, eye, right, up, parts, point, light: L,
        particleData: data, particleCount: n, ribbons, flipWedge: this.flipWedge,
        outline: this.outline ? { color: this.outline.color.map((v) => v / 255), alpha: 1 - this.outline.outlineT, grow: 0.07 } : null,
        flash: (1 - this.equipT) * (1 - this.equipT) * 0.25,
      };
    }
  }

  const ARC_DESC = {
    size: [[0, 0.28], [1, 0.1]], transparency: [[0, 0], [1, 1]], color: [[0, [255, 255, 255]], [1, [255, 255, 255]]],
    accel: [0, 0, 0], drag: 0, emission: 1,
  };

  /* ---------------------------------------------------------------- Preview */
  const THEMES = {
    forge: { top: [0.09, 0.1, 0.14], bottom: [0.03, 0.035, 0.05] },
    dusk: { top: [0.16, 0.12, 0.24], bottom: [0.04, 0.03, 0.08] },
    studio: { top: [0.3, 0.33, 0.38], bottom: [0.12, 0.13, 0.16] },
    daylight: { top: [0.55, 0.7, 0.88], bottom: [0.22, 0.3, 0.4] },
  };

  class Preview {
    static supported() {
      try {
        const c = document.createElement('canvas');
        return !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
      } catch (e) { return false; }
    }

    constructor(container, opts) {
      opts = opts || {};
      this.el = container;
      this.canvas = document.createElement('canvas');
      this.canvas.className = 'stage-canvas';
      this.canvas.setAttribute('aria-label', '3D preview of your sword. Drag to rotate, scroll to zoom, click to swing.');
      this.canvas.tabIndex = 0;
      container.appendChild(this.canvas);
      this.renderer = new Renderer(this.canvas, { preserve: !!opts.preserve });
      this.scene = new Scene({ avatar: opts.avatar !== false });
      this.theme = 'forge';
      this.autoRotate = opts.autoRotate !== false;
      this.cam = {
        yaw: 112 * D2R, pitch: 0.13, dist: 17, target: [0.6, 4.2, -0.4],
        goalDist: 17, goalTarget: [0.6, 4.2, -0.4], particleData: this.renderer.pData,
      };
      this.userT = -10;
      this.running = false;
      this.last = 0;
      this.pointers = new Map();
      this.bindInput();
      // phones drop the GL context when the tab is in the background; rebuild everything when it comes back
      this.canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); this.lost = true; });
      this.canvas.addEventListener('webglcontextrestored', () => {
        this.renderer.init();
        this.renderer.w = this.renderer.h = 0;
        this.lost = false;
        this.resize();
      });
      this.ro = new ResizeObserver(() => this.resize());
      this.ro.observe(container);
      this.resize();
    }

    setModel(model, opts) {
      this.scene.setModel(model, opts);
      this.frameCamera();
    }

    swing() { this.scene.swing(); }
    playMove(id) { this.scene.playMove(id); }
    setAvatar(on) { this.scene.avatar = on; this.frameCamera(); }
    setAutoRotate(on) { this.autoRotate = on; }
    setTheme(name) { this.theme = THEMES[name] ? name : 'forge'; }

    frameCamera(snap) {
      const s = this.scene;
      if (!s.model) return;
      const cam = this.cam;
      const aspect = this.canvas.clientWidth / Math.max(1, this.canvas.clientHeight);
      let cy, span, cx = 0.6, cz = -0.4;
      const swordTop = GRIP0[1] + s.swordTop;
      if (s.avatar) {
        const top = Math.max(5.6, swordTop + 0.6);
        cy = top / 2 - 0.1; span = top * 1.26;
        cx = 0.7; cz = -0.6;
      } else {
        const bottom = GRIP0[1] + s.swordBottom;
        cy = (swordTop + bottom) / 2; span = (swordTop - bottom) * 1.22 + 1.5;
        cx = GRIP0[0]; cz = GRIP0[2];
      }
      const tanF = Math.tan(FOV / 2);
      const dV = span / (2 * tanF);
      const dH = (span * 0.62) / (2 * tanF * Math.max(0.3, aspect));
      cam.goalTarget = [cx, cy, cz];
      cam.goalDist = Math.max(dV, dH, 5);
      if (snap) { cam.target = cam.goalTarget.slice(); cam.dist = cam.goalDist; }
    }

    resetCamera() {
      this.cam.yaw = 112 * D2R;
      this.cam.pitch = 0.13;
      this.frameCamera();
    }

    resize() {
      const w = this.canvas.clientWidth, h = this.canvas.clientHeight;
      if (!w || !h) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const k = Math.max(1.5, dpr);
      this.renderer.resize(w * k, h * k);
      this.frameCamera();
    }

    bindInput() {
      const cv = this.canvas;
      let down = null;
      cv.addEventListener('pointerdown', (e) => {
        cv.setPointerCapture(e.pointerId);
        this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        down = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
        this.userT = performance.now() / 1000;
      });
      cv.addEventListener('pointermove', (e) => {
        const p = this.pointers.get(e.pointerId);
        if (!p) return;
        const dx = e.clientX - p.x, dy = e.clientY - p.y;
        if (this.pointers.size === 1) {
          this.cam.yaw -= dx * 0.008;
          this.cam.pitch = Math.max(-0.35, Math.min(1.25, this.cam.pitch + dy * 0.006));
        } else if (this.pointers.size === 2) {
          const ids = [...this.pointers.keys()];
          const other = this.pointers.get(ids[0] === e.pointerId ? ids[1] : ids[0]);
          const before = Math.hypot(p.x - other.x, p.y - other.y);
          const after = Math.hypot(e.clientX - other.x, e.clientY - other.y);
          if (before > 0) this.cam.goalDist = Math.max(3, Math.min(90, this.cam.goalDist * (before / after)));
        }
        if (down) down.moved += Math.abs(dx) + Math.abs(dy);
        p.x = e.clientX; p.y = e.clientY;
        this.userT = performance.now() / 1000;
      });
      const up = (e) => {
        this.pointers.delete(e.pointerId);
        if (down && this.pointers.size === 0 && down.moved < 8 && performance.now() - down.t < 400) this.swing();
        if (this.pointers.size === 0) down = null;
      };
      cv.addEventListener('pointerup', up);
      cv.addEventListener('pointercancel', up);
      cv.addEventListener('wheel', (e) => {
        e.preventDefault();
        this.cam.goalDist = Math.max(3, Math.min(90, this.cam.goalDist * Math.exp(e.deltaY * 0.0012)));
        this.userT = performance.now() / 1000;
      }, { passive: false });
      cv.addEventListener('dblclick', () => this.resetCamera());
    }

    start() {
      if (this.running) return;
      this.running = true;
      this.last = performance.now();
      const tick = (now) => {

    if (p.t === 'color') return colorf(base);
    if (p.t === 'select') return selectf(Object.assign(base, { options: p.options }));
    return switchf(base);
  }

  function group(title, children, right) {
    return h('section', { class: 'group' }, h('div', { class: 'gtitle' }, h('span', {}, title), right || null), children);
  }

  /* ------------------------------------------------------- picker thumbnails */
  let glOK = false;
  const thumbCache = new Map();
  const thumbQueue = [];
  let thumbRunning = false;
  function queueThumb(key, w, h2, render, canvas) {
    if (!glOK) return;
    const cached = thumbCache.get(key);
    if (cached) { canvas.getContext('2d').drawImage(cached, 0, 0, canvas.width, canvas.height); return; }
    thumbQueue.push({ key, w, h: h2, render, canvas });
    if (!thumbRunning) runThumbs();
  }
  function runThumbs() {
    thumbRunning = true;
    const step = () => {
      const job = thumbQueue.shift();
      if (!job) { thumbRunning = false; return; }
      try {
        let cv = thumbCache.get(job.key);
        if (!cv) {
          const glc = job.render();
          cv = document.createElement('canvas');
          cv.width = job.w; cv.height = job.h;
          cv.getContext('2d').drawImage(glc, 0, 0, job.w, job.h);
          thumbCache.set(job.key, cv);
        }
        if (job.canvas.isConnected) job.canvas.getContext('2d').drawImage(cv, 0, 0, job.canvas.width, job.canvas.height);
      } catch (e) { /* a failed thumbnail just stays empty */ }
      setTimeout(step, 0);
    };
    setTimeout(step, 0);
  }
  const neutral = () => { const c = SF.defaultConfig(); c.effects = []; c.gem.where = 'none'; return c; };
  function bladeThumbCfg(id) {
    const c = SF.applyBladeStyle(neutral(), id);
    if (id === 'energy') { c.blade.color = '#4aa3ff'; c.grip.color = '#a9b2bd'; c.grip.material = 'Metal'; c.guard.style = 'none'; }
    return SF.normalize(c);
  }

  function stylePicker(o) {
    const grid = h('div', { class: 'pick-grid' });
    const btns = o.items.map(([id, label]) => {
      const cv = h('canvas', { width: o.wide ? 160 : 120, height: o.wide ? 120 : 160 });
      const b = h('button', { type: 'button', class: 'pick' + (o.wide ? ' wide' : ''), 'aria-pressed': 'false', title: o.titles ? o.titles[id] : label, onclick: () => { o.pick(id); } }, cv, h('span', {}, label));
      grid.append(b);
      queueThumb(o.prefix + id, cv.width, cv.height, () => o.render(id, cv.width, cv.height), cv);
      return b;
    });
    reg(() => btns.forEach((b, i) => b.setAttribute('aria-pressed', o.items[i][0] === o.get() ? 'true' : 'false')));
    return grid;
  }

  /* ------------------------------------------------------------------- tabs */
  const TABS = [['blade', 'Blade', 'blade'], ['hilt', 'Hilt', 'hilt'], ['fx', 'Effects', 'effects'], ['moves', 'Moves', 'moves'], ['powers', 'Powers', 'powers']];

  function buildTabs() {
    const tabs = $('#tabs');
    tabs.innerHTML = '';
    TABS.forEach(([id, label, icon]) => {
      const b = h('button', {
        class: 'tab', role: 'tab', id: 'tab-' + id, 'aria-selected': String(id === state.tab), 'aria-controls': 'panel',
        onclick: () => selectTab(id),
      }, iconEl(icon, 18), label);

    });
    tabs.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      const i = TABS.findIndex((t) => t[0] === state.tab);
      const n = (i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
      selectTab(TABS[n][0]);
      $('#tab-' + TABS[n][0]).focus();
    });
  }
  function selectTab(id) {
    const panel = $('#panel');
    if (panel) state.scroll[state.tab] = panel.scrollTop;
    state.tab = id;
    store.set('tab', id);

  function renderTab() {

    if (!panel) {

    syncers = [];
    ({ blade: bladeTab, hilt: hiltTab, fx: fxTab, moves: movesTab, powers: powersTab })[state.tab](panel);
    syncAll();
    panel.scrollTop = top;
  }

  /* ---- Effects tab */
  function layerSummary(l) {
    const spec = SF.FX_KINDS[l.kind];
    if (l.kind === 'particles') {
      const trig = { idle: 'always', swing: 'on swing', burst: 'swing burst', hit: 'on hit', equip: 'on equip' }[l.trigger];
      return (SF.PARTICLE_STYLES[l.style] || {}).label + ' · ' + trig;
    }
    if (l.kind === 'glow') return 'Brightness ' + l.brightness.toFixed(1) + ' · range ' + Math.round(l.range);
    if (l.kind === 'trail') return (l.always ? 'Always on' : 'On swing') + ' · ' + l.life.toFixed(2) + 's';
    if (l.kind === 'aura') return 'Thickness ' + l.size.toFixed(2);
    if (l.kind === 'arcs') return l.count + ' arcs';
    if (l.kind === 'rainbow') return 'Speed ' + l.speed.toFixed(1);
    return spec.blurb.slice(0, 40);
  }

  /* a particle style that suits the colour of the sword */
  function guessStyle(hex) {
    const [hue, sat, lig] = SF.rgb2hsl(SF.hex2rgb(hex));
    if (sat < 0.18) return lig > 0.6 ? 'magic' : 'smoke';
    if (hue < 18 || hue >= 340) return 'embers';
    if (hue < 45) return 'flames';
    if (hue < 70) return 'holy';
    if (hue < 170) return 'toxic';
    if (hue < 255) return 'frost';
    if (hue < 300) return 'void';
    return 'magic';
  }

  function addLayer(kind) {
    const layer = SF.makeLayer(kind);
    paintLayer(layer, swordPalette(state.cfg));
    if (kind === 'particles') {
      layer.style = guessStyle(swordPalette(state.cfg).glow);
      const st = SF.PARTICLE_STYLES[layer.style];
      if (!st.rainbow) { layer.color1 = st.c1; layer.color2 = st.c2; paintLayer(layer, swordPalette(state.cfg)); }
    }
    state.cfg.effects.push(layer);
    state.open.add(layer.id);
    syncers = [];
    commit();
    pushHistory();
    renderTab();
    const el = document.getElementById('layer-' + layer.id);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function layerCard(id) {
    const layer = state.cfg.effects.find((l) => l.id === id);

    const toggle = () => {
      const o = !state.open.has(id);
      if (o) state.open.add(id); else state.open.delete(id);
      card.classList.toggle('open', o);
      body.hidden = !o;
    };
    const head = h('div', { class: 'layer-head' },
      h('span', { class: 'ic', html: ico(spec.icon, 17) }),
      h('button', { type: 'button', class: 'ttl', onclick: toggle, 'aria-expanded': String(open) }, h('b', {}, spec.label), sub),
      h('span', { class: 'switch', title: 'Turn this effect on or off' }, switchInput, h('i')),
      h('button', { type: 'button', class: 'btn ghost small icon', title: 'Duplicate', 'aria-label': 'Duplicate effect', html: ico('dup', 16), onclick: () => {
        const copy = SF.clone(layer); copy.id = SF.newId(); state.cfg.effects.push(copy); state.open.add(copy.id); syncers = []; commit(); pushHistory(); renderTab();
      } }),
      h('button', { type: 'button', class: 'btn ghost small icon danger', title: 'Remove', 'aria-label': 'Remove effect', html: ico('trash', 16), onclick: () => {
        state.cfg.effects = state.cfg.effects.filter((l) => l.id !== id); state.open.delete(id); syncers = []; commit(); pushHistory(); renderTab();
      } }),
      h('button', { type: 'button', class: 'btn ghost small icon chev', title: 'Show settings', 'aria-label': 'Show settings', html: ico('chevron', 16), onclick: toggle })
    );
    switchInput.addEventListener('change', () => { layerAcc(id, 'on').set(switchInput.checked); card.classList.toggle('off', !switchInput.checked); pushHistory(); });
    spec.params.forEach((p) => body.append(paramField(p, layerAcc(id, p.k))));
    reg(() => {
      const l = state.cfg.effects.find((x) => x.id === id);
      if (!l) return;

      card.classList.toggle('off', !l.on);
      sub.textContent = layerSummary(l);

  /* ---- Moves tab: the animations (swing combo, stance, equip flourish) */
  function movesTab(root) {

      fn(state.cfg.anim);

  function powersTab(root) {

  /* -------------------------------------------------------------- randomizer */
  const NAME_A = ['Ember', 'Frost', 'Void', 'Storm', 'Solar', 'Lunar', 'Thorn', 'Crimson', 'Shadow', 'Golden', 'Iron', 'Silent', 'Wild', 'Ancient', 'Royal', 'Cursed', 'Radiant', 'Hollow', 'Jade', 'Obsidian'];
  const NAME_B = ['Fang', 'Brand', 'Edge', 'Reaver', 'Blade', 'Tongue', 'Song', 'Bane', 'Whisper', 'Cleaver', 'Sting', 'Talon', 'Oath', 'Vow', 'Wing', 'Spine', 'Heart', 'Thorn', 'Dawn', 'Gale'];
  function randomize() {
    const rnd = Math.random;
    const pick = (a) => a[Math.floor(rnd() * a.length)];
    let cfg = SF.defaultConfig();
    const style = pick(SF.BLADE_STYLE_IDS.filter((s) => s !== 'energy' || rnd() < 0.5));
    cfg = SF.applyBladeStyle(cfg, style);
    const pal = pick(PALETTES);
    const b = cfg.blade;
    b.length = clamp(b.length * (0.88 + rnd() * 0.3), 1.5, 8);
    b.width = clamp(b.width * (0.85 + rnd() * 0.35), 0.25, 1.6);
    if (style !== 'energy') {
      b.material = pal.hint.material;
      b.fuller = pick(['groove', 'inlay', 'inlay', 'none']);
      if (b.style !== 'katana' && b.style !== 'saber' && rnd() < 0.18) b.curve = Math.round((rnd() - 0.4) * 24);
    }
    cfg.guard.style = style === 'energy' ? pick(['none', 'winged', 'cross']) : pick(['cross', 'winged', 'drooped', 'crescent', 'horned', 'disc']);
    cfg.guard.width = 1.4 + rnd() * 1.6;
    cfg.guard.ends = rnd() < 0.35 ? 'ball' : 'none';
    cfg.grip.length = 0.9 + rnd() * 0.7;
    cfg.pommel.style = pick(['ball', 'ball', 'disc', 'cap', 'spike']);
    cfg.gem.where = pick(['none', 'guard', 'pommel', 'all']);
    applyPalette(cfg, pal);
    cfg.effects = [];
    const kinds = ['glow', 'particles', 'trail', 'aura', 'arcs'];
    const picks = [];
    if (rnd() < 0.9) picks.push('trail');
    if (rnd() < 0.7) picks.push('glow');
    if (rnd() < 0.8) picks.push('particles');
    if (rnd() < 0.25) picks.push('aura');
    if (rnd() < 0.15) picks.push('arcs');
    if (rnd() < 0.08) picks.push('rainbow');
    picks.forEach((k) => {
      const layer = SF.makeLayer(k);
      paintLayer(layer, pal);
      if (k === 'particles') {
        layer.style = pal.hint.particles || pick(SF.PARTICLE_STYLE_IDS);
        layer.trigger = pick(['idle', 'idle', 'swing', 'burst']);
        layer.where = pick(['blade', 'blade', 'tip']);
        layer.density = 0.8 + rnd() * 0.8;
        layer.count = 20 + Math.floor(rnd() * 20);
        if (layer.style === 'rainbow') { layer.color1 = '#ff4d4d'; layer.color2 = '#a24dff'; }
      }
      cfg.effects.push(layer);
    });
    void kinds;
    cfg.combat.damage = 14 + Math.floor(rnd() * 20);
    cfg.combat.cooldown = Math.round((0.3 + rnd() * 0.4) * 20) / 20;
    cfg.combat.swing = pick(['combo', 'combo', 'slash']);
    if (pal.hint.enchant && rnd() < 0.8) cfg.combat.enchants[pal.hint.enchant].on = true;
    if (rnd() < 0.25) cfg.combat.enchants.knockback.on = true;
    if (rnd() < 0.2) { cfg.combat.wave.mode = 'finisher'; cfg.combat.wave.color = pal.glow; }
    cfg.name = pick(NAME_A) + ' ' + pick(NAME_B);
    loadConfig(cfg, {});
    toast('Rolled "' + state.cfg.name + '"', 'good', 'dice');
  }

  /* ------------------------------------------------------- syntax highlighting */
  const LUA_KW = new Set(['and', 'break', 'do', 'else', 'elseif', 'end', 'false', 'for', 'function', 'if', 'in', 'local', 'nil', 'not', 'or', 'repeat', 'return', 'then', 'true', 'until', 'while', 'continue']);
  const LUA_API = new Set(['game', 'workspace', 'script', 'Instance', 'Vector3', 'Vector2', 'CFrame', 'Color3', 'ColorSequence', 'ColorSequenceKeypoint', 'NumberSequence', 'NumberSequenceKeypoint', 'NumberRange', 'Enum', 'OverlapParams', 'RaycastParams', 'task', 'math', 'table', 'string', 'os', 'pcall', 'pairs', 'ipairs', 'print', 'warn', 'tostring', 'tonumber', 'type', 'select']);
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function highlight(code, depth) {
    const re = /(--\[(=*)\[[\s\S]*?\]\2\])|(--[^\n]*)|(\[(=*)\[[\s\S]*?\]\5\])|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
    let out = '', last = 0, m;
    while ((m = re.exec(code))) {
      out += esc(code.slice(last, m.index));
      last = m.index + m[0].length;
      if (m[1] || m[3]) out += '<span class="tk-com">' + esc(m[0]) + '</span>';
      else if (m[4]) {
        const eqs = m[5].length;
        if (eqs >= 2 && !depth) {                      // the Script that lives inside the Tool: highlight it as code
          const open = '[' + m[5] + '[', close = ']' + m[5] + ']';
          out += '<span class="tk-str">' + esc(open) + '</span>' + highlight(m[0].slice(open.length, m[0].length - close.length), 1) + '<span class="tk-str">' + esc(close) + '</span>';
        } else out += '<span class="tk-str">' + esc(m[0]) + '</span>';
      } else if (m[6]) out += '<span class="tk-str">' + esc(m[0]) + '</span>';
      else if (m[7]) out += '<span class="tk-num">' + m[0] + '</span>';
      else if (m[8]) {
        const w = m[8];
        if (LUA_KW.has(w)) out += '<span class="tk-kw">' + w + '</span>';
        else if (LUA_API.has(w)) out += '<span class="tk-api">' + w + '</span>';
        else if (code[last] === '(' ) out += '<span class="tk-fn">' + w + '</span>';
        else out += w;
      }
    }
    return out + esc(code.slice(last));
  }

              h('button', { type: 'button', 'aria-pressed': 'true', onclick: () => { exportPart = 'sword'; updateCode(); } }, 'Sword Script'),
              h('button', { type: 'button', 'aria-pressed': 'false', onclick: () => { exportPart = 'animator'; updateCode(); } }, 'Animator (LocalScript)'))),
          h('div', { class: 'code-wrap', tabindex: '0', 'aria-label': 'Generated Luau script' }, h('pre', { class: 'gut', 'aria-hidden': 'true' }), h('pre', { class: 'code' }))
        )
      )
    );
    dlg.showModal();
    updateCode();
  }
  function onBackdrop(e) { if (e.target === e.currentTarget) e.currentTarget.close(); }
  function selectCode() {
    const code = $('#export-dlg .code');
    if (!code) return;
    const r = document.createRange();
    r.selectNodeContents(code);
    const s = getSelection();
    s.removeAllRanges(); s.addRange(r);
  }
  function downloadText(name, text, type) {
    const blob = new Blob([text], { type: type || 'text/plain' });
    const a = h('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  /* ---------------------------------------------------------- library dialog */
  const toB64 = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const fromB64 = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0)));
  function parseSwordCode(text) {
    text = String(text || '').trim();
    const m = text.match(/#s=([A-Za-z0-9_\-]+)/);
    if (m) text = fromB64(m[1]);
    else if (!/^[\[{]/.test(text) && /^[A-Za-z0-9_\-]{40,}$/.test(text)) text = fromB64(text);
    const obj = JSON.parse(text);
    if (!obj || typeof obj !== 'object') throw new Error('not a sword');
    return SF.normalize(obj);
  }
  const saved = () => store.get('saved', []);

  function openLibrary() {
    const dlg = $('#library-dlg');
    const render = () => {
      dlg.innerHTML = '';
      const list = saved();
      const nameIn = h('input', { type: 'text', class: 'textin', maxlength: 32, 'aria-label': 'Name for the saved sword' });
      nameIn.value = state.cfg.name;
      const paste = h('textarea', { rows: 4, class: 'textin', placeholder: 'Paste a sword code here', 'aria-label': 'Sword code', style: { display: 'none', marginTop: '8px' } });
      const pasteGo = h('button', { type: 'button', class: 'btn', style: { display: 'none', marginTop: '8px' }, onclick: () => {
        try { loadConfig(parseSwordCode(paste.value)); dlg.close(); toast('Sword loaded', 'good', 'check'); } catch (e) { toast('That does not look like a sword code', 'warn', 'help'); }
      } }, 'Load this sword');
      const rows = list.length ? list.map((s) => h('div', { class: 'mine-row' },
        h('span', { class: 'nm', title: s.name }, s.name),
        h('button', { type: 'button', class: 'btn small', onclick: () => { loadConfig(s.cfg); dlg.close(); } }, 'Load'),
        h('button', { type: 'button', class: 'btn small icon ghost danger', 'aria-label': 'Delete ' + s.name, html: ico('trash', 15), onclick: () => { store.set('saved', saved().filter((x) => x.id !== s.id)); render(); } })))
        : [h('p', { class: 'empty-note' }, 'Nothing saved yet. Swords you save stay in this browser.')];
      const fileIn = h('input', { type: 'file', accept: '.json,application/json,.txt', class: 'sr', 'aria-label': 'Import a sword file', onchange: async (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        try { loadConfig(parseSwordCode(await f.text())); dlg.close(); toast('Sword loaded', 'good', 'check'); } catch (err) { toast('Could not read that file', 'warn', 'help'); }
      } });
      dlg.append(
        h('div', { class: 'sheet-head' }, h('h2', { id: 'library-title' }, 'My swords'), h('button', { type: 'button', class: 'btn icon ghost', 'aria-label': 'Close', html: ico('close'), onclick: () => dlg.close() })),
        h('div', { style: { padding: '16px', overflow: 'auto', display: 'grid', gap: '20px' } },
          h('section', {}, h('div', { class: 'eyebrow', style: { marginBottom: '8px' } }, 'Save this sword'),
            h('div', { style: { display: 'flex', gap: '8px' } }, h('div', { style: { flex: 1, minWidth: 0 } }, nameIn), h('button', { type: 'button', class: 'btn primary', onclick: () => {
              const name = nameIn.value.trim() || state.cfg.name;
              const copy = SF.clone(state.cfg); copy.name = name;
              store.set('saved', [{ id: SF.newId(), name, cfg: copy, ts: Date.now() }].concat(saved()).slice(0, 40));
              toast('Saved "' + name + '"', 'good', 'save'); render();
            } }, iconEl('save', 16), 'Save'))),
          h('section', {}, h('div', { class: 'eyebrow', style: { marginBottom: '8px' } }, 'Saved swords (' + list.length + ')'), h('div', { class: 'mine-list' }, rows)),
          h('section', {}, h('div', { class: 'eyebrow', style: { marginBottom: '8px' } }, 'Share or back up'),
            h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } },
              h('button', { type: 'button', class: 'btn', onclick: async () => { (await copyText(JSON.stringify(state.cfg))) ? toast('Sword code copied', 'good', 'copy') : toast('Could not copy', 'warn', 'help'); } }, iconEl('copy', 16), 'Copy sword code'),
              h('button', { type: 'button', class: 'btn', onclick: () => { paste.style.display = 'block'; pasteGo.style.display = 'inline-flex'; paste.focus(); } }, iconEl('upload', 16), 'Paste a code'),
              ENV.canShareLink ? h('button', { type: 'button', class: 'btn', onclick: async () => {
                const url = location.href.split('#')[0] + '#s=' + toB64(JSON.stringify(state.cfg));
                (await copyText(url)) ? toast('Link copied. Anyone who opens it gets this sword.', 'good', 'link') : toast('Could not copy', 'warn', 'help');
              } }, iconEl('link', 16), 'Copy share link') : null,
              ENV.canDownload ? h('button', { type: 'button', class: 'btn', onclick: () => downloadText((state.cfg.name.replace(/[^A-Za-z0-9]+/g, '_') || 'sword') + '.sword.json', JSON.stringify(state.cfg, null, 2), 'application/json') }, iconEl('download', 16), 'Download file') : null,
              h('label', { class: 'btn', style: { position: 'relative' } }, iconEl('upload', 16), 'Open file', fileIn)),
            paste, pasteGo)
        )
      );
    };
    render();
    dlg.showModal();
  }

  /* ------------------------------------------------------------------- init */
  function bindGlobal() {
    $('#sword-name').addEventListener('input', (e) => { state.cfg.name = e.target.value; commit({ keepPreset: true }); });
    $('#sword-name').addEventListener('change', pushHistory);
    document.addEventListener('keydown', (e) => {
      const t = e.target;
      const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
      if (mod && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return; }
      if (typing || mod || e.altKey || document.querySelector('dialog[open]')) return;
      if (e.key === ' ' && (t === document.body || t.classList.contains('stage-canvas'))) { e.preventDefault(); preview && preview.swing(); }
      else if (e.key.toLowerCase() === 'r') randomize();
    });
    ['#export-dlg', '#library-dlg'].forEach((id) => $(id).addEventListener('click', onBackdrop));
    document.addEventListener('visibilitychange', () => { if (preview) { document.hidden ? preview.stop() : preview.start(); } });
  }

  function init() {
    $('#brand-mark').innerHTML = ico('sword', 20);
    const saveTheme = store.get('theme', null);
    if (saveTheme && !ENV.artifact) document.documentElement.setAttribute('data-theme', saveTheme);

    glOK = SF.Preview.supported();
    if (glOK) {
      try {
        preview = new SF.Preview($('#stage'), { autoRotate: state.stage.spin });
        preview.setAvatar(state.stage.avatar);
        preview.setTheme(SCENES[state.stage.scene]);
      } catch (e) { preview = null; glOK = false; }
    }
    if (!glOK) { $('#nogl').classList.add('show'); document.body.classList.add('no-gl'); }

    state.tab = store.get('tab', 'blade');
    if (!TABS.some((t) => t[0] === state.tab)) state.tab = 'blade';

    // starting sword: shared link > last session > the Flame Tongue
    let start = null, fromHash = false;
    if (ENV.canShareLink) {
      const m = location.hash.match(/#s=([A-Za-z0-9_\-]+)/);
      if (m) { try { start = parseSwordCode(m[1]); fromHash = true; } catch (e) { start = null; } }
    }
    if (!start) { const s = store.get('current', null); if (s) { try { start = SF.normalize(s); } catch (e) { start = null; } } }
    let presetId = null;
    if (!start) { const p = SF.presetById('flame'); start = SF.clone(p.cfg); presetId = p.id; }
    state.cfg = SF.normalize(start);
    state.presetId = presetId;
    void fromHash;

    buildTopActions();
    buildStageUI();
    buildTabs();
    buildPalettes();
    buildGallery();
    bindGlobal();
    paintThemeButton();
    refreshAll({ equip: true });
    pushHistory();
    markPreset();
    if (preview) { preview.start(); preview.frameCamera(true); }
    if (!glOK) document.querySelectorAll('.card canvas, .pick canvas').forEach((c) => { c.style.display = 'none'; });
  }

  SF.app = { state, commit, loadConfig, randomize, openExport, openLibrary, undo, redo, highlight, get preview() { return preview; } };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})((globalThis.SF = globalThis.SF || {}));
</script>
</body>
</html>
