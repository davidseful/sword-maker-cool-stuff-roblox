<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sword Forge</title>
<meta name="description" content="Design a Roblox sword in 3D, then copy the finished Luau script into Studio.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ==========================================================================
   Sword Forge
   Layout: a workshop bench. Left rack = premade swords, middle = the anvil
   (the 3D stage), right = the tool wall (every control). Floating plates on a
   dark bench; the stage glows in whatever colour the sword is.
   Colour: blued steel. Graphite plates with a blue bias, one working accent
   (temper blue) and one reward accent (straw gold), named after the colours
   steel turns when it is heat-treated.
   Type: Big Shoulders Display (stamped-steel headings), Hanken Grotesk (UI),
   JetBrains Mono (numbers, code).
   ========================================================================== */

:root {
  --bg: #0c0f15;
  --plate: #141923;
  --plate-2: #1a2130;
  --plate-3: #232c3e;
  --line: #2d384c;
  --line-soft: #212a3a;
  --text: #e9eef7;
  --muted: #9ba8be;
  --faint: #67748b;
  --temper: #6f95ff;
  --temper-strong: #93b0ff;
  --on-temper: #081025;
  --straw: #f3c96b;
  --good: #55d8a2;
  --warn: #f5ba4e;
  --bad: #ff7b7b;
  --sword: #ff8a3d;
  --code-bg: #0a0d13;
  --code-text: #cfd8e8;
  --tok-kw: #c792ea;
  --tok-str: #a3d97c;
  --tok-num: #f2b36b;
  --tok-com: #5f6e86;
  --tok-api: #82b1ff;
  --tok-fn: #7fd6e6;
  --shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
  --r: 8px;
  --r-s: 5px;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue Condensed", Impact, sans-serif;
  --font-ui: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e9edf4;
    --plate: #ffffff;
    --plate-2: #f2f5fa;
    --plate-3: #e6ebf3;
    --line: #cdd5e2;
    --line-soft: #dbe1ec;
    --text: #131a29;
    --muted: #4e5b73;
    --faint: #8190a8;
    --temper: #2f5be0;
    --temper-strong: #1f46bd;
    --on-temper: #ffffff;
    --straw: #9a6a12;
    --good: #12805a;
    --warn: #9a6200;
    --bad: #c42f2f;
    --code-bg: #f6f8fc;
    --code-text: #25304a;
    --tok-kw: #8a3fc0;
    --tok-str: #2c7a2c;
    --tok-num: #a35a10;
    --tok-com: #7d8aa3;
    --tok-api: #1f5fcc;
    --tok-fn: #0b7a8c;
    --shadow: 0 14px 30px rgba(30, 45, 80, 0.16);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e9edf4;
  --plate: #ffffff;
  --plate-2: #f2f5fa;
  --plate-3: #e6ebf3;
  --line: #cdd5e2;
  --line-soft: #dbe1ec;
  --text: #131a29;
  --muted: #4e5b73;
  --faint: #8190a8;
  --temper: #2f5be0;
  --temper-strong: #1f46bd;
  --on-temper: #ffffff;
  --straw: #9a6a12;
  --good: #12805a;
  --warn: #9a6200;
  --bad: #c42f2f;
  --code-bg: #f6f8fc;
  --code-text: #25304a;
  --tok-kw: #8a3fc0;
  --tok-str: #2c7a2c;
  --tok-num: #a35a10;
  --tok-com: #7d8aa3;
  --tok-api: #1f5fcc;
  --tok-fn: #0b7a8c;
  --shadow: 0 14px 30px rgba(30, 45, 80, 0.16);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 400 14px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
svg.ico { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--temper-strong); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--temper) 45%, transparent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------------ app shell */
.app {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr) 376px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top top" "gal stage insp";
  gap: 12px;
  height: 100%;
  padding: 12px 16px 16px;
}
.top { grid-area: top; }
.gallery { grid-area: gal; }
.stage-col { grid-area: stage; }
.inspector { grid-area: insp; }
.plate {
  background: var(--plate);
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
}

/* ---------------------------------------------------------------------- top bar */
.top {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  padding: 0 4px;
}
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand-mark {
  display: grid; place-items: center;
  width: 34px; height: 34px;
  border-radius: 7px;
  color: var(--on-temper);
  background: var(--temper);
  clip-path: polygon(0 0, 100% 0, 100% 72%, 72% 100%, 0 100%);
}
.brand-name {
  font: 800 25px/1 var(--font-display);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.brand-name small { display: block; font: 600 10.5px/1 var(--font-ui); letter-spacing: 0.18em; color: var(--muted); margin-top: 3px; }
.name-field { flex: 1 1 200px; min-width: 120px; max-width: 360px; margin-inline: auto; }
.name-field input {
  width: 100%;
  background: transparent;
  border: 0;
  border-bottom: 1px dashed var(--line);
  padding: 6px 2px;
  font: 700 19px/1.2 var(--font-display);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-align: center;
  color: var(--text);
}
.name-field input:hover { border-bottom-color: var(--faint); }
.name-field input:focus { outline: none; border-bottom: 1px solid var(--temper-strong); }
.top-actions { display: flex; align-items: center; gap: 6px; flex: none; }

/* --------------------------------------------------------------------- buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 34px;
  padding: 0 12px;
  background: var(--plate-2);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  color: var(--text);
  font-weight: 600;
  font-size: 13px;
  white-space: nowrap;
  transition: background 0.12s, border-color 0.12s, transform 0.06s;
}
.btn:hover { background: var(--plate-3); border-color: var(--faint); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.4; pointer-events: none; }
.btn.icon { width: 34px; padding: 0; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--plate-2); color: var(--text); border-color: var(--line-soft); }
.btn.primary {
  background: var(--temper);
  border-color: var(--temper);
  color: var(--on-temper);
  font-weight: 700;
  min-height: 38px;
  padding: 0 16px;
}
.btn.primary:hover { background: var(--temper-strong); border-color: var(--temper-strong); }
.btn.gold { background: color-mix(in srgb, var(--straw) 16%, var(--plate-2)); border-color: color-mix(in srgb, var(--straw) 55%, var(--line)); color: var(--straw); }
.btn.gold:hover { background: color-mix(in srgb, var(--straw) 26%, var(--plate-2)); }
.btn.danger:hover { color: var(--bad); border-color: var(--bad); }
.btn.small { min-height: 28px; padding: 0 9px; font-size: 12px; }
.btn.small.icon { width: 28px; padding: 0; }
.btn.on { background: color-mix(in srgb, var(--temper) 20%, var(--plate-2)); border-color: var(--temper); color: var(--text); }

.eyebrow {
  font: 700 11.5px/1 var(--font-ui);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.section-title {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin: 0 0 10px;
  font: 700 15px/1 var(--font-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text);
}

/* ---------------------------------------------------------------------- gallery */
.gallery { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.gallery-scroll { overflow: auto; padding: 14px; min-height: 0; flex: 1; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card {
  position: relative;
  display: flex; flex-direction: column;
  padding: 0;
  text-align: left;
  background: var(--plate-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
  overflow: hidden;
  transition: border-color 0.12s, transform 0.12s, box-shadow 0.12s;
}
.card:hover { border-color: var(--faint); transform: translateY(-1px); }
.card canvas { display: block; width: 100%; aspect-ratio: 3 / 4; background: #0d1119; }
.card .meta { display: flex; flex-direction: column; gap: 2px; padding: 8px 9px 9px; min-width: 0; }
.card .nm { font-weight: 700; font-size: 12.5px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .tg { font: 600 10px/1 var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.card[aria-pressed="true"] {
  border-color: var(--sword);
  box-shadow: 0 0 0 1px var(--sword), 0 8px 26px -10px color-mix(in srgb, var(--sword) 70%, transparent);
}
.card[aria-pressed="true"] .tg { color: var(--sword); }
.mine { margin-top: 18px; }
.mine-list { display: flex; flex-direction: column; gap: 6px; }
.mine-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px;
  padding: 3px 3px 3px 10px;
  background: var(--plate-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-s);
}
.mine-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 12.5px; }
.empty-note { color: var(--faint); font-size: 12.5px; line-height: 1.5; padding: 4px 2px; }

/* ------------------------------------------------------------------------ stage */
.stage-col { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.stage {
  position: relative;
  flex: 1;
  min-height: 0;
  border-radius: var(--r);
  overflow: hidden;
  background: #090b10;
  border: 1px solid color-mix(in srgb, var(--sword) 30%, var(--line-soft));
  box-shadow: 0 0 70px -26px color-mix(in srgb, var(--sword) 60%, transparent);
  transition: border-color 0.4s, box-shadow 0.4s;
}
.stage-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline-offset: -3px; }
.stage-canvas:active { cursor: grabbing; }
.stage-ui { position: absolute; display: flex; gap: 6px; z-index: 2; }
.stage-ui.tl { top: 10px; left: 10px; }
.stage-ui.tr { top: 10px; right: 10px; }
.stage-ui.bc { bottom: 12px; left: 50%; transform: translateX(-50%); align-items: center; }
.stage-ui .btn { background: color-mix(in srgb, #0a0d14 72%, transparent); border-color: rgba(255, 255, 255, 0.12); color: #e7edf7; backdrop-filter: blur(6px); }
.stage-ui .btn:hover { background: color-mix(in srgb, #1a2232 82%, transparent); }
.stage-ui .btn.on { background: color-mix(in srgb, var(--temper) 38%, #0a0d14); border-color: var(--temper); }
.stage-ui .btn.primary { background: var(--temper); border-color: var(--temper-strong); color: var(--on-temper); backdrop-filter: none; }
.stage-ui .btn.primary:hover { background: var(--temper-strong); }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px;
  background: color-mix(in srgb, #0a0d14 72%, transparent);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 999px;
  color: #c4cee0;
  font: 500 11.5px/1 var(--font-mono);
  backdrop-filter: blur(6px);
  white-space: nowrap;
}
.chip b { color: #fff; font-weight: 600; }
.swing-btn { min-height: 40px; padding: 0 18px; font-size: 14px; letter-spacing: 0.02em; }
.hint { position: absolute; left: 12px; bottom: 14px; z-index: 1; max-width: calc(50% - 96px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(214, 224, 242, 0.55); font-size: 11.5px; pointer-events: none; }
.nogl { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: #c8d2e4; background: #0c1018; z-index: 3; }
.nogl.show { display: grid; }
.nogl p { max-width: 36ch; margin: 6px auto 0; color: #93a0b8; }

.statbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; }
.statbar .stat { display: flex; align-items: baseline; gap: 6px; padding-right: 14px; border-right: 1px solid var(--line-soft); }
.statbar .stat:last-of-type { border-right: 0; }
.statbar .stat b { font: 800 21px/1 var(--font-display); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.statbar .stat span { color: var(--muted); font-size: 12px; }
.statbar .grow { flex: 1; }
.statbar .powers { flex: 1 1 170px; color: var(--muted); font-size: 12.5px; line-height: 1.3; min-width: 0; }
.statbar .powers b { color: var(--text); font-weight: 600; }

/* --------------------------------------------------------------------- inspector */
.inspector { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.palettes { padding: 12px 14px 10px; border-bottom: 1px solid var(--line-soft); }
.palettes .eyebrow { display: flex; justify-content: space-between; margin-bottom: 8px; }
.pal-row { display: flex; gap: 7px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.pal {
  flex: none;
  display: grid; grid-template-columns: repeat(3, 12px); grid-template-rows: 12px 12px;
  gap: 2px;
  padding: 4px;
  background: var(--plate-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-s);
}
.pal:hover { border-color: var(--faint); }
.pal i { display: block; border-radius: 2px; }
.pal i:first-child { grid-row: 1 / 3; grid-column: 1 / 2; width: 12px; height: 26px; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line-soft); }
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 9px 4px 8px;
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font: 700 11.5px/1 var(--font-ui);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--temper); }
.tab[aria-selected="true"] svg { color: var(--temper-strong); }
.tabpanel { flex: 1; min-height: 0; overflow: auto; padding: 14px 14px 28px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.tabpanel[hidden] { display: none; }

.group { margin: 0 0 18px; }
.group > .gtitle {
  display: flex; align-items: center; justify-content: space-between;
  margin: 0 0 6px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line-soft);
  font: 700 12px/1 var(--font-ui);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.field { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 5px 10px; margin: 11px 0; }
.field.row { grid-template-columns: minmax(0, 1fr) auto; }
.field > label, .field > .lab { color: var(--text); font-size: 13px; min-width: 0; }
.field output { font: 500 12px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.field input[type="range"] { grid-column: 1 / -1; }
.field .full { grid-column: 1 / -1; }
.hint-text { color: var(--faint); font-size: 12px; line-height: 1.45; margin: 4px 0 0; }

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 18px; margin: 0;
  background: transparent;
  --pct: 50%;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 4px;
  background: linear-gradient(to right, var(--temper) var(--pct), var(--line) var(--pct));
}
input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--temper); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; margin-top: -6px;
  border-radius: 50%;
  background: var(--text);
  border: 3px solid var(--plate);
  box-shadow: 0 0 0 1px var(--temper), 0 2px 6px rgba(0, 0, 0, 0.4);
}
input[type="range"]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--text);
  border: 3px solid var(--plate);
  box-shadow: 0 0 0 1px var(--temper);
}
input[type="range"]:hover::-webkit-slider-thumb { background: var(--temper-strong); }

.select { position: relative; display: block; min-width: 0; }
.select select {
  width: 100%;
  appearance: none; -webkit-appearance: none;
  min-height: 34px;
  padding: 0 30px 0 10px;
  background: var(--plate-2);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  color: var(--text);
  font-size: 13px;
}
.select select:hover { border-color: var(--faint); }
.select svg { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); }

.textin {
  width: 100%; min-height: 34px;
  padding: 0 10px;
  background: var(--plate-2);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  color: var(--text);
  font-size: 13px;
}
.textin:focus { outline: none; border-color: var(--temper-strong); }
textarea.textin { padding: 8px 10px; font: 400 12px/1.5 var(--font-mono); resize: vertical; }
.colorf { display: flex; align-items: center; gap: 8px; }
.colorf .sw {
  position: relative;
  width: 34px; height: 30px; flex: none;
  border-radius: var(--r-s);
  border: 1px solid var(--line);
  overflow: hidden;
  background-image: linear-gradient(45deg, #888 25%, transparent 25%), linear-gradient(-45deg, #888 25%, transparent 25%);
  background-size: 8px 8px;
}
.colorf .sw::after { content: ""; position: absolute; inset: 0; background: var(--c, #888); }
.colorf .sw input { position: absolute; inset: -6px; width: 150%; height: 150%; opacity: 0; cursor: pointer; z-index: 2; padding: 0; border: 0; }
.colorf .hex {
  width: 84px; min-height: 30px;
  background: var(--plate-2);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  padding: 0 8px;
  font: 500 12px/1 var(--font-mono);
  text-transform: uppercase;
  color: var(--text);
}
.colorf .hex:focus { outline: none; border-color: var(--temper-strong); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px; background: var(--plate-2); border: 1px solid var(--line-soft); border-radius: var(--r-s); }
.seg button {
  min-height: 28px; padding: 0 6px;
  background: transparent; border: 0; border-radius: 3px;
  color: var(--muted); font-size: 12px; font-weight: 600;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--plate-3); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }

.switch { position: relative; width: 36px; height: 20px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 2; }
.switch i { position: absolute; inset: 0; background: var(--line); border-radius: 20px; transition: background 0.14s; }
.switch i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text); transition: transform 0.14s; }
.switch input:checked + i { background: var(--temper); }
.switch input:checked + i::after { transform: translateX(16px); background: var(--on-temper); }
.switch input:focus-visible + i { outline: 2px solid var(--temper-strong); outline-offset: 2px; }

.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 7px; margin: 0 0 6px; }
.pick {
  display: flex; flex-direction: column; align-items: stretch;
  padding: 0;
  background: var(--plate-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-s);
  overflow: hidden;
  color: var(--muted);
}
.pick canvas { display: block; width: 100%; aspect-ratio: 3 / 4; background: #0d1119; }
.pick.wide canvas { aspect-ratio: 4 / 3; }
.pick span { padding: 5px 4px 6px; font: 600 10.5px/1.15 var(--font-ui); text-align: center; letter-spacing: 0.02em; }
.pick:hover { border-color: var(--faint); color: var(--text); }
.pick[aria-pressed="true"] { border-color: var(--temper); box-shadow: 0 0 0 1px var(--temper); color: var(--text); }
.pick-note { color: var(--faint); font-size: 12px; margin: 2px 0 12px; }

/* effect layers + enchant cards */
.layer { background: var(--plate-2); border: 1px solid var(--line-soft); border-radius: var(--r); margin: 0 0 8px; }
.layer.off { opacity: 0.62; }
.layer-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 10px; }
.layer-head .ic { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; background: var(--plate-3); color: var(--temper-strong); flex: none; }
.layer-head .ttl { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; padding: 0; color: var(--text); }
.layer-head .ttl b { display: block; font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-head .ttl small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-body { padding: 2px 12px 12px; border-top: 1px solid var(--line-soft); }
.layer-body[hidden] { display: none; }
.layer .chev { transition: transform 0.15s; }
.layer.open .chev { transform: rotate(180deg); }
.addbar { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin: 4px 0 14px; }
.addbtn {
  display: flex; align-items: center; gap: 9px; text-align: left;
  min-height: 44px; padding: 6px 10px;
  background: transparent; border: 1px dashed var(--line); border-radius: var(--r-s);
  color: var(--muted);
}
.addbtn:hover { color: var(--text); border-color: var(--temper); background: color-mix(in srgb, var(--temper) 8%, transparent); }
.addbtn svg { color: var(--temper-strong); }
.addbtn b { display: block; font-size: 12.5px; color: var(--text); font-weight: 700; line-height: 1.15; }
.addbtn small { display: block; font-size: 11px; color: var(--faint); line-height: 1.2; }
.empty-fx { padding: 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); margin-bottom: 12px; }

.ench-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
.ench { background: var(--plate-2); border: 1px solid var(--line-soft); border-radius: var(--r); }
.ench.on { border-color: color-mix(in srgb, var(--temper) 60%, var(--line-soft)); }
.ench-head { display: flex; align-items: center; gap: 10px; padding: 9px 10px; }
.ench-head .ic { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; background: var(--plate-3); color: var(--muted); flex: none; }
.ench.on .ic { color: var(--straw); }
.ench-head .t { flex: 1; min-width: 0; }
.ench-head .t b { display: block; font-size: 13px; font-weight: 700; }
.ench-head .t small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.3; }
.ench-body { padding: 0 12px 10px; border-top: 1px solid var(--line-soft); }
.ench-body[hidden] { display: none; }

/* ---------------------------------------------------------------------- dialog */
dialog.sheet {
  width: min(980px, calc(100vw - 24px));
  max-height: calc(100vh - 24px);
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--plate);
  color: var(--text);
  box-shadow: var(--shadow);
  overflow: hidden;
}
dialog.sheet[open] { display: flex; flex-direction: column; }
dialog.sheet::backdrop { background: rgba(5, 8, 14, 0.66); backdrop-filter: blur(3px); }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
.sheet-head h2 { margin: 0; font: 800 24px/1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; overflow: hidden; flex: 1; }
.sheet-side { padding: 16px; border-right: 1px solid var(--line-soft); overflow: auto; }
.sheet-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.steps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 14px; }
.steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; }
.steps .n { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--plate-3); border: 1px solid var(--line); font: 700 12px/1 var(--font-mono); color: var(--straw); }
.steps b { display: block; font-size: 13.5px; margin-bottom: 2px; }
.steps p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.steps kbd, .kbd { font: 500 11.5px/1 var(--font-mono); padding: 2px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--plate-2); color: var(--text); }
.code-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line-soft); }
.code-bar .grow { flex: 1; min-width: 0; }
.code-meta { font: 500 11.5px/1 var(--font-mono); color: var(--muted); }
.code-wrap { position: relative; flex: 1; min-height: 0; overflow: auto; background: var(--code-bg); display: grid; grid-template-columns: auto minmax(0, 1fr); font: 400 12px/1.55 var(--font-mono); color: var(--code-text); }
.code-wrap pre { margin: 0; padding: 12px 14px; white-space: pre; tab-size: 4; }
.code-wrap .gut { color: var(--faint); text-align: right; user-select: none; padding-right: 8px; border-right: 1px solid var(--line-soft); position: sticky; left: 0; background: var(--code-bg); }
.code-wrap .code { overflow: visible; }
.tk-kw { color: var(--tok-kw); }
.tk-str { color: var(--tok-str); }
.tk-num { color: var(--tok-num); }
.tk-com { color: var(--tok-com); font-style: italic; }
.tk-api { color: var(--tok-api); }
.tk-fn { color: var(--tok-fn); }
details.fold { margin-top: 16px; border-top: 1px solid var(--line-soft); padding-top: 10px; }
details.fold summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 12.5px; padding: 4px 0; }
details.fold[open] summary { color: var(--text); }
details.fold p, details.fold li { color: var(--muted); font-size: 12.5px; line-height: 1.55; }
details.fold ul { margin: 6px 0; padding-left: 18px; }
.summary-list { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; color: var(--muted); font-size: 12.5px; }
.summary-list b { color: var(--text); font-weight: 600; }

/* ----------------------------------------------------------------------- toasts */
.toasts { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; z-index: 50; pointer-events: none; width: min(92vw, 420px); }
.toast {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px;
  background: var(--plate-3);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  font-weight: 600;
  font-size: 13px;
  animation: toast-in 0.18s ease-out;
}
.toast.good svg { color: var(--good); }
.toast.warn svg { color: var(--warn); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.cta-mobile { display: none; }
.head-copy { display: none; }

/* ------------------------------------------------------------------ responsive */
@media (max-width: 1220px) {
  .app { grid-template-columns: minmax(0, 1fr) 356px; grid-template-areas: "top top" "stage insp" "gal insp"; grid-template-rows: auto minmax(0, 1fr) auto; }
  .gallery { overflow: visible; }
  .gallery-scroll { padding: 12px 14px; overflow: visible; }
  .gallery .cards { display: flex; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .gallery .card { flex: 0 0 104px; }
  .gallery .mine { display: none; }
  .card canvas { aspect-ratio: 1 / 1.1; }
}
@media (max-width: 920px) {
  html, body { height: auto; }
  .app {
    display: flex;
    flex-direction: column;
    height: auto;
    gap: 12px;
    padding: 10px 16px calc(84px + env(safe-area-inset-bottom, 0px));
  }
  .top, .gallery, .inspector { flex: none; }
  .top { flex-wrap: wrap; row-gap: 8px; }
  .name-field { order: 5; flex: 1 1 100%; max-width: none; margin: 0; }
  .brand-name small { display: none; }
  .top-actions .cta-desktop, .top-actions .hide-s { display: none; }
  /* the stage stays in view while you scroll through the controls */
  .stage-col { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; flex: none; padding-block: 6px; margin-block: -6px; background: var(--bg); }
  .stage { flex: none; height: min(44vh, 400px); min-height: 250px; }
  .statbar { display: none; }
  .inspector { overflow: visible; }
  .tabpanel { overflow: visible; }
  .cta-mobile {
    display: flex; gap: 8px;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    border-top: 1px solid var(--line-soft);
    backdrop-filter: blur(8px);
  }
  .cta-mobile .btn { min-height: 46px; font-size: 15px; }
  .cta-mobile .btn.primary { flex: 1 1 auto; }
  .hint { display: none; }
  .head-copy { display: inline-flex; }
  .sheet-body { grid-template-columns: minmax(0, 1fr); overflow: auto; }
  .sheet-side { border-right: 0; border-bottom: 1px solid var(--line-soft); overflow: visible; }
  .sheet-main { min-height: 420px; }
  dialog.sheet { max-height: calc(100vh - 12px); }
}
@media (max-width: 920px) and (max-height: 520px) {
  .stage-col { position: static; }
  .stage { height: 320px; }
}
@media (max-width: 520px) {
  .cta-mobile .btn:not(.primary) { flex: none; width: 48px; padding: 0; }
  .cta-mobile .btn:not(.primary) .lab { display: none; }
  .brand-name { font-size: 22px; }
  .stage-ui.tr .chip.hide-xs { display: none; }
  .stage-ui .btn span.lab { display: none; }
  .cards { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---- export dialog: which of the two scripts is shown */
.part-row { padding: 8px 14px 0; }
.part-row:has(.part-tabs[hidden]) { display: none; }

/* ---- Moves tab */
.movelist { display: grid; gap: 6px; margin: 4px 0 14px; }
.move {
  display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
  padding: 8px 10px; background: var(--plate-2); border: 1px solid var(--line-soft); border-radius: var(--r-s); color: var(--muted);
}
.move:hover { color: var(--text); border-color: var(--line); }
.move[aria-pressed="true"] { color: var(--text); border-color: var(--temper); background: color-mix(in srgb, var(--temper) 10%, var(--plate-2)); }
.move b { display: block; font-size: 12.5px; color: var(--text); font-weight: 700; line-height: 1.2; }
.move small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.3; margin-top: 1px; }
.move .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.move[aria-pressed="true"] .dot { border-color: var(--temper-strong); background: var(--temper-strong); box-shadow: inset 0 0 0 2px var(--plate-2); }
.swingrow { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px; margin: 0 0 6px; background: var(--plate-2); border: 1px solid var(--line-soft); border-radius: var(--r-s); }
.swingrow .n { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--plate-3); font: 700 11.5px/1 var(--font-mono); color: var(--muted); }
.swingrow .select { flex: 1; min-width: 0; }
.swingrow .btn.icon { min-width: 30px; min-height: 30px; padding: 0; }
.swingrow .n.fin { background: color-mix(in srgb, var(--straw) 22%, var(--plate-3)); color: var(--straw); box-shadow: inset 0 0 0 1px var(--straw); }
</style>
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <div class="brand">
      <div class="brand-mark" id="brand-mark"></div>
      <div class="brand-name">Sword Forge<small>ROBLOX SWORD MAKER</small></div>
    </div>
    <div class="name-field"><input id="sword-name" type="text" maxlength="32" spellcheck="false" autocomplete="off" aria-label="Sword name" placeholder="NAME YOUR SWORD"></div>
    <div class="top-actions" id="top-actions"></div>
  </header>

  <aside class="gallery plate" id="gallery" aria-label="Premade swords">
    <div class="gallery-scroll">
      <h2 class="section-title">Premade swords</h2>
      <div class="cards" id="cards"></div>
    </div>
  </aside>

  <main class="stage-col">
    <section class="stage" id="stage" aria-label="3D preview">
      <div class="stage-ui tl" id="stage-tl"></div>
      <div class="stage-ui tr" id="stage-tr"></div>
      <div class="hint">Drag to turn &middot; scroll to zoom &middot; click the sword to swing</div>
      <div class="stage-ui bc" id="stage-bc"></div>
      <div class="nogl" id="nogl"><div><b>The 3D preview needs WebGL</b><p>Your browser has it switched off, so there is no live picture. Everything else still works: pick a sword, change it, and copy the script.</p></div></div>
    </section>
    <div class="statbar plate" id="statbar"></div>
  </main>

  <aside class="inspector plate" id="inspector" aria-label="Sword settings">
    <div class="palettes">
      <div class="eyebrow"><span>Color theme</span><span id="pal-note"></span></div>
      <div class="pal-row" id="pal-row"></div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="panels"></div>
  </aside>

  <div class="cta-mobile" id="cta-mobile"></div>
</div>

<dialog class="sheet" id="export-dlg" aria-labelledby="export-title"></dialog>
<dialog class="sheet" id="library-dlg" aria-labelledby="library-title"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* ---- js/data.js ---- */
/* ==========================================================================
   Sword Forge - data.js
   Constants, option lists, effect/enchant schemas, defaults and normalising.
   Pure data + tiny helpers: no DOM access, so it also loads in Node (tests).
   ========================================================================== */
(function (SF) {
  'use strict';

  SF.VERSION = 1;

  /* ------------------------------------------------------------------ colors */
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  SF.clamp = clamp;

  function hex2rgb(hex) {
    let h = String(hex || '#000000').trim().replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    if (!/^[0-9a-fA-F]{6}$/.test(h)) h = '000000';
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function rgb2hex(rgb) {
    return '#' + rgb.map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  }
  function mixRgb(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function mixHex(a, b, t) {
    return rgb2hex(mixRgb(hex2rgb(a), hex2rgb(b), t));
  }
  function hsl2rgb(h, s, l) {
    h = ((h % 360) + 360) % 360;
    s = clamp(s, 0, 1);
    l = clamp(l, 0, 1);
    const k = (n) => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [f(0) * 255, f(8) * 255, f(4) * 255];
  }
  function hsl2hex(h, s, l) {
    return rgb2hex(hsl2rgb(h, s, l));
  }
  function rgb2hsl(rgb) {
    const r = rgb[0] / 255, g = rgb[1] / 255, b = rgb[2] / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    let h = 0, s = 0;
    const l = (mx + mn) / 2;
    if (mx !== mn) {
      const d = mx - mn;
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s, l];
  }
  function lighten(hex, amt) {
    return mixHex(hex, '#ffffff', amt);
  }
  function darken(hex, amt) {
    return mixHex(hex, '#000000', amt);
  }
  Object.assign(SF, { hex2rgb, rgb2hex, mixRgb, mixHex, hsl2rgb, hsl2hex, rgb2hsl, lighten, darken });

  /* --------------------------------------------------------------- materials */
  // Every value is a real Enum.Material name (the Luau engine also falls back to Plastic if one is missing).
  SF.MATERIALS = [
    ['SmoothPlastic', 'Smooth Plastic'],
    ['Plastic', 'Plastic'],
    ['Metal', 'Metal'],
    ['DiamondPlate', 'Diamond Plate'],
    ['Foil', 'Foil'],
    ['CorrodedMetal', 'Corroded Metal'],
    ['Wood', 'Wood'],
    ['WoodPlanks', 'Wood Planks'],
    ['Fabric', 'Fabric'],
    ['Marble', 'Marble'],
    ['Granite', 'Granite'],
    ['Slate', 'Slate'],
    ['Basalt', 'Basalt'],
    ['Ice', 'Ice'],
    ['Glacier', 'Glacier'],
    ['Glass', 'Glass'],
    ['CrackedLava', 'Cracked Lava'],
    ['Neon', 'Neon (glows)'],
    ['ForceField', 'Force Field'],
  ];
  SF.MATERIAL_IDS = SF.MATERIALS.map((m) => m[0]);

  /* Look used by the preview renderer: [specular, shininess, metalTint, emissive, alphaDefault]. */
  SF.MATERIAL_LOOK = {
    SmoothPlastic: { spec: 0.35, shin: 40, metal: 0, emit: 0 },
    Plastic: { spec: 0.18, shin: 18, metal: 0, emit: 0 },
    Metal: { spec: 1.0, shin: 70, metal: 0.8, emit: 0 },
    DiamondPlate: { spec: 0.85, shin: 50, metal: 0.7, emit: 0 },
    Foil: { spec: 1.1, shin: 90, metal: 0.9, emit: 0 },
    CorrodedMetal: { spec: 0.35, shin: 18, metal: 0.4, emit: 0 },
    Wood: { spec: 0.05, shin: 8, metal: 0, emit: 0 },
    WoodPlanks: { spec: 0.05, shin: 8, metal: 0, emit: 0 },
    Fabric: { spec: 0.0, shin: 4, metal: 0, emit: 0 },
    Marble: { spec: 0.5, shin: 40, metal: 0, emit: 0 },
    Granite: { spec: 0.15, shin: 14, metal: 0, emit: 0 },
    Slate: { spec: 0.15, shin: 14, metal: 0, emit: 0 },
    Basalt: { spec: 0.12, shin: 12, metal: 0, emit: 0 },
    Ice: { spec: 0.9, shin: 60, metal: 0.1, emit: 0.08 },
    Glacier: { spec: 0.7, shin: 50, metal: 0.1, emit: 0.05 },
    Glass: { spec: 1.0, shin: 90, metal: 0.2, emit: 0.0 },
    CrackedLava: { spec: 0.1, shin: 10, metal: 0, emit: 0.55 },
    Neon: { spec: 0.0, shin: 1, metal: 0, emit: 1.0 },
    ForceField: { spec: 0.4, shin: 30, metal: 0, emit: 0.85 },
  };

  /* ------------------------------------------------------------ small option lists */
  SF.GUARD_STYLES = [
    ['cross', 'Crossguard'],
    ['winged', 'Winged'],
    ['drooped', 'Drooped'],
    ['crescent', 'Crescent'],
    ['horned', 'Horned'],
    ['disc', 'Disc (tsuba)'],
    ['none', 'None'],
  ];
  SF.POMMEL_STYLES = [
    ['ball', 'Ball'],
    ['disc', 'Disc'],
    ['cap', 'Cap'],
    ['spike', 'Spike'],
    ['none', 'None'],
  ];
  SF.GEM_PLACES = [
    ['none', 'No gem'],
    ['guard', 'Guard'],
    ['pommel', 'Pommel'],
    ['blade', 'Blade'],
    ['all', 'Everywhere'],
  ];
  SF.FULLER_STYLES = [
    ['none', 'None'],
    ['groove', 'Groove (two-tone)'],
    ['inlay', 'Glowing inlay'],
  ];
  SF.SWING_STYLES = [
    ['combo', '3-hit combo'],
    ['slash', 'Slash'],
    ['lunge', 'Lunge'],
  ];

  /* ------------------------------------------------------------- blade styles
     body : [[fractionAlongBody, widthFraction], ...]      (width fraction of blade.width)
     tip  : 'point' (symmetric) | 'clip' (one-sided clipped point)
     The "defaults" are applied when the user picks the style in the UI.      */
  SF.BLADE_STYLES = {
    straight: {
      label: 'Longsword', desc: 'Classic double-edged blade.',
      body: [[0, 1], [1, 1]], tip: 'point',
      defaults: { length: 3.6, width: 0.72, thickness: 0.14, tip: 0.95, curve: 0, taper: 0, serrated: 0 },
    },
    broad: {
      label: 'Broadsword', desc: 'Wide, heavy and proud.',
      body: [[0, 1], [1, 0.92]], tip: 'point',
      defaults: { length: 3.4, width: 1.15, thickness: 0.2, tip: 0.8, curve: 0, taper: 0, serrated: 0 },
    },
    leaf: {
      label: 'Leaf blade', desc: 'Bulges in the middle, like a leaf.',
      body: [[0, 0.5], [0.42, 1], [1, 0.84]], tip: 'point',
      defaults: { length: 3.5, width: 0.95, thickness: 0.14, tip: 1.0, curve: 0, taper: 0, serrated: 0 },
    },
    katana: {
      label: 'Katana', desc: 'Slim, slightly curved, one clipped edge.',
      body: [[0, 1], [1, 0.88]], tip: 'clip',
      defaults: { length: 3.9, width: 0.5, thickness: 0.1, tip: 0.7, curve: 8, taper: 0, serrated: 0 },
    },
    saber: {
      label: 'Scimitar', desc: 'Curved with a belly toward the tip.',
      body: [[0, 0.78], [0.65, 1], [1, 0.96]], tip: 'clip',
      defaults: { length: 3.6, width: 0.78, thickness: 0.12, tip: 0.8, curve: 18, taper: 0, serrated: 0 },
    },

  /* ---------------------------------------------------------------- normalize
     Accepts any (possibly partial / older / hand-edited) config and returns a
     complete, clamped, safe one. Never throws.                                  */
  function num(v, def, min, max) {
    v = Number(v);
    if (!isFinite(v)) v = def;
    return clamp(v, min, max);
  }
  function pickOpt(v, list, def) {
    const ids = list.map((o) => (Array.isArray(o) ? o[0] : o));
    return ids.includes(v) ? v : def;
  }
  function col(v, def) {
    return typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v) ? v.toLowerCase() : def;
  }
  function cleanName(s) {
    s = String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f]/g, '').replace(/\s+/g, ' ').trim();
    if (s.length > 32) s = s.slice(0, 32).trim();
    return s || 'My Sword';
  }
  function normParams(specs, src, out) {
    specs.forEach((p) => {
      const v = src ? src[p.k] : undefined;
      if (p.t === 'range') {
        // snap to the slider's step so saved / shared / hand-edited values stay tidy (24, not 23.99999)
        const x = num(v, p.def, p.min, p.max);
        const dec = (String(p.step).split('.')[1] || '').length;
        out[p.k] = clamp(Number((Math.round((x - p.min) / p.step) * p.step + p.min).toFixed(dec)), p.min, p.max);
      }
      else if (p.t === 'color') out[p.k] = col(v, p.def);
      else if (p.t === 'select') out[p.k] = pickOpt(v, p.options, p.def);
      else if (p.t === 'bool') out[p.k] = typeof v === 'boolean' ? v : !!p.def;
    });
    return out;
  }
  SF.normParams = normParams;

  SF.normalize = function (input) {
    const d = SF.defaultConfig();
    const s = input && typeof input === 'object' ? input : {};
    const out = { v: SF.VERSION };
    out.name = cleanName(s.name != null ? s.name : d.name);
    out.scale = num(s.scale, 1, 0.4, 3);
    out.wedgeFlip = s.wedgeFlip === true; // advanced: mirror every WedgePart (see README > Troubleshooting)
    out.hold = { tilt: num(s.hold && s.hold.tilt, 0, -60, 60) };

    // blade
    const sb = s.blade || {};
    const style = pickOpt(sb.style, SF.BLADE_STYLE_IDS, 'straight');
    const sd = SF.BLADE_STYLES[style].defaults;
    const b = {};
    b.style = style;
    b.length = num(sb.length, sd.length, 1.2, 10);
    b.width = num(sb.width, sd.width, 0.15, 3.5);
    b.thickness = num(sb.thickness, sd.thickness, 0.05, 0.8);
    b.tip = num(sb.tip, sd.tip, 0, 4);
    b.tip = Math.min(b.tip, b.length - 0.3);
    if (style === 'energy') b.tip = 0;
    b.curve = num(sb.curve, sd.curve, -35, 45);
    b.taper = num(sb.taper, sd.taper, 0, 0.85);
    b.serrated = Math.round(num(sb.serrated, sd.serrated, 0, 14));
    b.fuller = pickOpt(sb.fuller, SF.FULLER_STYLES, 'none');
    b.color = col(sb.color, d.blade.color);
    b.material = pickOpt(sb.material, SF.MATERIAL_IDS, 'Metal');
    b.accent = col(sb.accent, d.blade.accent);
    b.coreColor = col(sb.coreColor, d.blade.coreColor);
    b.transparency = num(sb.transparency, 0, 0, 0.9);
    out.blade = b;

    // guard
    const sg = s.guard || {};
    out.guard = {
      style: pickOpt(sg.style, SF.GUARD_STYLES, 'cross'),
      width: num(sg.width, d.guard.width, 0.5, 6),
      height: num(sg.height, d.guard.height, 0.1, 1.2),
      thickness: num(sg.thickness, d.guard.thickness, 0.1, 1.4),
      ends: pickOpt(sg.ends, ['none', 'ball'], 'none'),
      color: col(sg.color, d.guard.color),
      material: pickOpt(sg.material, SF.MATERIAL_IDS, 'Metal'),
    };

    // grip
    const sr = s.grip || {};
    out.grip = {
      length: num(sr.length, d.grip.length, 0.5, 3),
      radius: num(sr.radius, d.grip.radius, 0.08, 0.6),

    } else if (G.style === 'disc') {
      const d = Math.max(0.6, G.width);
      gpart({ n: 'Guard', s: 'Cylinder', sz: [G.height, d, d], p: [0, gy, 0], R: eulerToMat([0, 0, 90]) });
    }

    /* ============================== GRIP ============================== */
    const Gr = cfg.grip;
    add({ n: 'Grip', s: 'Cylinder', sz: [g, Gr.radius * 2, Gr.radius * 2], p: [0, 0, 0], R: eulerToMat([0, 0, 90]), c: Gr.color, m: Gr.material, role: 'grip' });
    if (Gr.wrap) {
      const n = Math.max(2, Math.floor(g / 0.24));
      for (let i = 0; i < n; i++) {
        const y = -g / 2 + (g * (i + 0.5)) / n;
        add({ n: 'GripWrap', s: 'Cylinder', sz: [0.07, Gr.radius * 2 + 0.05, Gr.radius * 2 + 0.05], p: [0, y, 0], R: eulerToMat([0, 0, 90]), c: Gr.wrapColor, m: Gr.material, role: 'grip' });
      }
    }

    /* ============================== POMMEL ============================== */
    const Pm = cfg.pommel;
    let pommelBottom = gripBot;
    if (Pm.style === 'ball') {
      const y = gripBot - Pm.size / 2 + 0.07;
      add({ n: 'Pommel', s: 'Ball', sz: [Pm.size, Pm.size, Pm.size], p: [0, y, 0], c: Pm.color, m: Pm.material, role: 'pommel' });
      pommelBottom = y - Pm.size / 2;
    } else if (Pm.style === 'disc') {
      const th = 0.2;
      const y = gripBot - th / 2 + 0.03;
      add({ n: 'Pommel', s: 'Cylinder', sz: [th, Pm.size * 1.25, Pm.size * 1.25], p: [0, y, 0], R: eulerToMat([0, 0, 90]), c: Pm.color, m: Pm.material, role: 'pommel' });
      pommelBottom = y - th / 2;
    } else if (Pm.style === 'cap') {
      const th = Pm.size * 0.7;
      const y = gripBot - th / 2 + 0.03;
      add({ n: 'Pommel', s: 'Cylinder', sz: [th, Pm.size * 1.15, Pm.size * 1.15], p: [0, y, 0], R: eulerToMat([0, 0, 90]), c: Pm.color, m: Pm.material, role: 'pommel' });
      pommelBottom = y - th / 2;
    } else if (Pm.style === 'spike') {
      const ln = Pm.size * 1.5;
      const y = gripBot - ln / 2 + 0.03;
      const tt = Math.max(0.14, Pm.size * 0.45);
      const Q = rotZ(Math.PI);                    // flip so the point faces down
      segPieces(ln, Pm.size / 2, 0, Pm.size / 2, 0, tt).forEach((pc) => {
        addXf(pc, Q, [0, y, 0], { n: 'Pommel', c: Pm.color, m: Pm.material, role: 'pommel' });
      });
      pommelBottom = y - ln / 2;
    }

    /* ============================== GEMS ============================== */
    const Ge = cfg.gem;
    const gemPlates = (y, depthX) => {
      const s = Ge.size;
      [1, -1].forEach((sd) => {
        add({ n: 'Gem', s: 'Block', sz: [0.12, s, s], p: [sd * depthX, y, 0], R: eulerToMat([45, 0, 0]), c: Ge.color, m: 'Neon', role: 'gem', rainbow: false });
      });
    };
    if ((Ge.where === 'guard' || Ge.where === 'all') && !noGuard) gemPlates(gy, G.style === 'disc' ? 0.12 : G.thickness / 2 + 0.01);
    if (Ge.where === 'blade' || Ge.where === 'all') gemPlates(bladeBase + Math.min(0.55 + Ge.size / 2, L * 0.4), b.thickness / 2 + 0.04);
    if (Ge.where === 'pommel' || Ge.where === 'all') {
      const s = Ge.size;
      add({ n: 'Gem', s: 'Ball', sz: [s, s, s], p: [0, pommelBottom - s * 0.1, 0], c: Ge.color, m: 'Neon', role: 'gem' });
    }

    /* ======================= ENERGY AURA (effect layer) ======================= */
    const auraLayers = cfg.effects.filter((e) => e.kind === 'aura' && e.on);
    auraLayers.forEach((layer) => {
      if (growBlade) { growBlade(layer.size, layer); return; }
      // energy blade: a bigger copy of the colored shell and its cap
      bladeParts.filter((bp) => !bp.noAura).forEach((bp) => {
        const grow = layer.size * 2;
        const sz = bp.s === 'Ball' ? [bp.sz[0] + grow, bp.sz[1] + grow, bp.sz[2] + grow] : [bp.sz[0] + grow * 0.7, bp.sz[1] + grow, bp.sz[2] + grow];
        const part = add({
          n: 'Aura', s: bp.s, sz, p: bp.p, R: bp.R, c: layer.color, m: 'Neon', t: layer.transparency, role: 'aura', rainbow: true,
        });
        part.auraPulse = layer.pulse;
      });
    });

    /* ====================== finish: scale, round, euler ====================== */
    const clampS = (v) => Math.max(0.05, v);
    const out = parts.map((p) => {
      const sz = p.sz.map((v) => r3(clampS(v * sc)));
      if (p.s === 'Ball') { const m = Math.max(sz[0], sz[1], sz[2]); sz[0] = sz[1] = sz[2] = m; }
      // "Flip wedges": if a Roblox version draws WedgeParts mirrored, a half-turn about Y puts them right again
      const R = p.s === 'Wedge' && cfg.wedgeFlip ? mul3(p.R, rotY(Math.PI)) : p.R;
      const e = matToEuler(R).map(r2);
      const o = { n: p.n, s: p.s, sz, p: p.p.map((v) => r3(v * sc)), r: e, c: p.c, m: p.m, t: r2(p.t), rf: r2(p.rf), role: p.role };
      if (p.main) o.main = true;
      if (p.rainbow) o.rainbow = true;
      if (p.auraPulse) o.auraPulse = p.auraPulse;
      return o;
    });

    /* ============================ derived geometry ============================ */
    function aabb(part) {
      const R = eulerToMat(part.r);
      const h = part.sz.map((v) => v / 2);
      const ext = [0, 1, 2].map((i) => Math.abs(R[i * 3]) * h[0] + Math.abs(R[i * 3 + 1]) * h[1] + Math.abs(R[i * 3 + 2]) * h[2]);
      return { min: part.p.map((v, i) => v - ext[i]), max: part.p.map((v, i) => v + ext[i]) };
    }
    let mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    out.filter((p) => p.role === 'blade').forEach((p) => {
      const a = aabb(p);
      for (let i = 0; i < 3; i++) { mn[i] = Math.min(mn[i], a.min[i]); mx[i] = Math.max(mx[i], a.max[i]); }
    });
    const reach = cfg.combat.reach;
    const hbSize = [
      Math.max(mx[0] - mn[0], 0.3) + 0.9 * sc,
      (mx[1] - mn[1] + 0.5 * sc) * reach,
      (mx[2] - mn[2] + 0.8 * sc) * reach,
    ];
    const hbPos = [0, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2];

    const baseP = path.pos(0), tipP = path.pos(L);
    const trail = {
      a: [0, r3((baseP[1] + 0.15) * sc), 0],
      b: [0, r3(tipP[1] * sc), r3(tipP[2] * sc)],
    };
    const midP = path.pos(L * 0.55);
    const sample = {
      // random point inside the blade volume (for preview particles)
      blade: (rnd) => {
        const s = rnd() * L;
        const p = path.pos(s);
        const th = path.theta(s);
        const wz = (rnd() - 0.5) * b.width * 0.8;
        return [(rnd() - 0.5) * b.thickness * sc, (p[1] - Math.sin(th) * wz) * sc, (p[2] + Math.cos(th) * wz) * sc];
      },
      tip: [0, tipP[1] * sc, tipP[2] * sc],
      hilt: [0, guardY * sc, 0],
    };

    const stats = {
      parts: out.length,
      length: r3((bladeBase + L - pommelBottom) * sc),
      bladeLength: r3(L * sc),
    };

    return {
      cfg, parts: out, trail,
      layout: { guardY: r3(guardY * sc), gripTop: r3(gripTop * sc), bladeBase: r3(bladeBase * sc), pommelBottom: r3(pommelBottom * sc) },
      hitbox: { size: hbSize.map(r3), pos: hbPos.map(r3) },
      tip: sample.tip, mid: [0, r3(midP[1] * sc), r3(midP[2] * sc)], hilt: sample.hilt,
      sample, stats, scale: sc,
      effects: SF.resolveEffects(cfg),
      path: { L, curve: b.curve, bladeBase },
    };
  };

  /* ------------------------------------------------------ effect resolution */
  const rgb = SF.hex2rgb;
  function seq(list, mul) {
    return list.map(([t, v]) => [t, SF.clamp(v * (mul || 1), 0, 100)]);
  }
  function colorSeq(c1, c2, rainbow) {
    if (rainbow) {
      const stops = SF.RAINBOW_STOPS;
      return stops.map((h, i) => [i / (stops.length - 1), rgb(h)]);
    }
    return [[0, rgb(c1)], [1, rgb(c2)]];
  }

  SF.resolveEffects = function (cfgIn) {
    const cfg = SF.normalize(cfgIn);
    const sc = cfg.scale;
    const out = [];
    cfg.effects.forEach((l) => {
      if (!l.on) return;
      if (l.kind === 'glow') {
        out.push({ kind: 'glow', color: rgb(l.color), brightness: l.brightness, range: Math.round(l.range * Math.sqrt(sc) * 10) / 10, pulse: l.pulse });
      } else if (l.kind === 'particles') {
        const st = SF.PARTICLE_STYLES[l.style] || SF.PARTICLE_STYLES.flames;
        const burst = l.trigger === 'burst' || l.trigger === 'hit' || l.trigger === 'equip';
        const sizeMul = l.size * Math.sqrt(sc);
        const spd = l.speed;
        out.push({
          kind: 'particles', name: st.label.replace(/[^A-Za-z0-9]/g, ''), style: l.style, where: l.where, trigger: l.trigger,
          texture: SF.TEXTURES[st.tex],
          color: colorSeq(l.color1, l.color2, st.rainbow),
          size: seq(st.size, sizeMul).map(([t, v]) => [t, Math.round(v * 1000) / 1000]),
          transparency: st.trans.map(([t, v]) => [t, v]),
          lifetime: st.life.slice(),
          speed: [Math.round(st.speed[0] * spd * 100) / 100, Math.round(st.speed[1] * spd * 100) / 100],
          spread: [st.spread, st.spread],
          accel: st.accel.slice(),
          drag: st.drag,
          rate: burst ? 0 : Math.max(1, Math.round(st.rate * l.density * Math.sqrt(sc))),
          count: burst ? Math.round(l.count) : 0,
          rot: st.rot.slice(), rotSpeed: st.rotSpeed.slice(),
          emission: st.emission, locked: !!st.locked,
        });
      } else if (l.kind === 'trail') {
        out.push({
          kind: 'trail', color: [[0, rgb(l.color1)], [1, rgb(l.color2)]],
          transparency: [[0, 0.28], [0.5, 0.72], [1, 1]],
          width: [[0, Math.round(l.width * 100) / 100], [1, Math.round(l.width * 8) / 100]],
          life: l.life, glow: l.glow, always: l.always,
        });
      } else if (l.kind === 'aura') {
        out.push({ kind: 'aura', color: rgb(l.color), pulse: l.pulse, transparency: l.transparency });
      } else if (l.kind === 'outline') {
        out.push({ kind: 'outline', color: rgb(l.color), fill: rgb(l.fill), fillT: l.fillT, outlineT: l.outlineT });
      } else if (l.kind === 'rainbow') {
        out.push({ kind: 'rainbow', speed: l.speed });
      } else if (l.kind === 'arcs') {
        out.push({ kind: 'arcs', color: rgb(l.color), count: Math.round(l.count), amp: l.amp, speed: l.speed });
      }
    });
    return out;
  };

  SF.matToEuler = matToEuler;
  SF.eulerToMat = eulerToMat;
})((globalThis.SF = globalThis.SF || {}));

/* ==========================================================================
   Sword Forge - engine.js
   The Luau code that ends up inside every generated script. It is kept as
   separate blocks so the generator can include only what a sword needs.

   Tests (tests/run.mjs) execute every block in a real Luau VM against a mock
   Roblox API, so keep this file free of Roblox calls the mock does not know.
   ========================================================================== */

  E.helpers = String.raw`local function c3(c)
	return Color3.fromRGB(c[1], c[2], c[3])
end

local function v3(v)
	return Vector3.new(v[1], v[2], v[3])
end

-- looks up an Enum item by name, with a fallback if this Roblox version doesn't have it
local function enumItem(enumType, name, fallback)
	local ok, item = pcall(function()
		return enumType[name]
	end)
	if ok and item ~= nil then
		return item
	end
	return fallback
end

-- sets properties one by one; a property that doesn't exist is skipped instead of breaking the sword
local function setProps(instance, props)
	for key, value in pairs(props) do
		local ok, err = pcall(function()
			instance[key] = value
		end)
		if not ok then
			warn("[SwordForge] could not set " .. instance.ClassName .. "." .. key .. " (" .. tostring(err) .. ")")
		end
	end
end

local function colorSeq(list) -- { {time, {r,g,b}}, ... }
	local points = {}
	for _, key in ipairs(list) do
		table.insert(points, ColorSequenceKeypoint.new(key[1], c3(key[2])))
	end
	return ColorSequence.new(points)
end

local function numSeq(list) -- { {time, value}, ... }
	local points = {}
	for _, key in ipairs(list) do
		table.insert(points, NumberSequenceKeypoint.new(key[1], key[2]))
	end
	return NumberSequence.new(points)
end`;

  /* ------------------------------------------------------------ builder: parts */
  E.builderTop = String.raw`-- one Part (Block, Wedge, Cylinder or Ball) from a CONFIG.Parts entry
local function makePart(d)
	local part
	if d.s == "Wedge" then
		part = Instance.new("WedgePart")
	else
		part = Instance.new("Part")
		if d.s == "Cylinder" then
			part.Shape = Enum.PartType.Cylinder
		elseif d.s == "Ball" then
			part.Shape = Enum.PartType.Ball
		end
	end
	part.Name = d.n
	part.Size = v3(d.sz)
	part.Color = c3(d.c)
	part.Material = enumItem(Enum.Material, d.m, Enum.Material.Plastic)
	part.Transparency = d.t
	part.Reflectance = d.rf
	setProps(part, {
		Anchored = false,
		CanCollide = false,
		CanTouch = false,
		CanQuery = false,
		Massless = true,
		CastShadow = (d.m ~= "Neon" and d.t == 0),
		TopSurface = Enum.SurfaceType.Smooth,
		BottomSurface = Enum.SurfaceType.Smooth,
	})
	return part
end

-- glues "part" to "root"; "offset" is where the part sits relative to the root
local function weldTo(root, part, offset)
	local weld = Instance.new("Weld")
	weld.Name = "SwordWeld"
	weld.Part0 = root
	weld.Part1 = part
	weld.C0 = offset
	weld.Parent = part
end

-- one builder function per kind of effect (glow, particles, trail ...)
local FX = {}`;

  /* ------------------------------------------------------------ builder: buildSword */
  E.builderMain = String.raw`-- builds the whole sword and returns the Tool
local function buildSword()
	local tool = Instance.new("Tool")
	tool.Name = CONFIG.Name
	tool.ToolTip = CONFIG.Name
	tool.RequiresHandle = true
	tool.CanBeDropped = false
	-- Grip = how the sword sits in the hand (tilt leans the blade forward)
	tool.Grip = CFrame.new(0, 0, 0) * CFrame.Angles(math.rad(CONFIG.Tilt), 0, 0)

	-- the Handle is an invisible anchor point in the hand; every other part is welded to it
	local handle = Instance.new("Part")
	handle.Name = "Handle"
	handle.Size = Vector3.new(0.4, 0.4, 0.4)
	handle.Transparency = 1
	setProps(handle, {
		Anchored = false,
		CanCollide = false,
		CanTouch = false,
		CanQuery = false,
		Massless = true,
		CastShadow = false,
	})
	handle.Parent = tool

	local ctx = { tool = tool, handle = handle }

	for _, d in ipairs(CONFIG.Parts) do
		local part = makePart(d)
		weldTo(handle, part, CFrame.new(d.p[1], d.p[2], d.p[3]) * CFrame.Angles(math.rad(d.r[1]), math.rad(d.r[2]), math.rad(d.r[3])))
		part.Parent = tool
		if d.main and not ctx.main then
			ctx.main = part
		end
		if d.rb then
			part:SetAttribute("Rainbow", true)
		end
		if d.ap then
			part:SetAttribute("AuraPulse", d.ap)
		end
	end

	-- an invisible box that follows the blade; it decides what a swing hits
	local hitbox = Instance.new("Part")
	hitbox.Name = "Hitbox"
	hitbox.Size = v3(CONFIG.Hitbox.sz)
	hitbox.Transparency = 1
	setProps(hitbox, {
		Anchored = false,
		CanCollide = false,
		CanTouch = false,
		CanQuery = false,
		Massless = true,
		CastShadow = false,
	})
	weldTo(handle, hitbox, CFrame.new(CONFIG.Hitbox.p[1], CONFIG.Hitbox.p[2], CONFIG.Hitbox.p[3]))
	hitbox.Parent = tool

	-- invisible points that effects (trails, particles ...) attach to
	local function attachment(name, position)
		local point = Instance.new("Attachment")
		point.Name = name
		point.Position = v3(position)
		point.Parent = handle
		return point
	end
	ctx.trailBase = attachment("TrailBase", CONFIG.Trail.a)
	ctx.trailTip = attachment("TrailTip", CONFIG.Trail.b)
	ctx.tipPoint = attachment("TipPoint", CONFIG.Tip)
	ctx.hiltPoint = attachment("HiltPoint", CONFIG.Hilt)

	-- sounds (they use sounds that already come with Roblox, so nothing to upload)
	for name, id in pairs(CONFIG.Sounds) do
		if id ~= "" then
			local sound = Instance.new("Sound")
			sound.Name = name .. "Sound"
			sound.SoundId = id
			sound.Volume = 0.8
			sound.Parent = handle
		end
	end

	-- stats become Attributes, so you can also edit them in the Properties window
	for key, value in pairs(STATS) do
		tool:SetAttribute(key, value)
	end

	-- visual effects
	for index, d in ipairs(CONFIG.Effects) do
		local build = FX[d.kind]
		if build then
			local ok, err = pcall(build, d, ctx)
			if not ok then
				warn("[SwordForge] effect #" .. index .. " (" .. d.kind .. ") failed: " .. tostring(err))
			end
		end
	end

	return tool
end`;

  E.combatServices = String.raw`local Players = game:GetService("Players")

	registry[humanoid] = os.clock() + duration

  E.enchantUtil.movement = String.raw`-- slows / freezes a Humanoid for a while, then puts its WalkSpeed back
local movement = {}
local function changeMovement(humanoid, slowFactor, slowSeconds, stunSeconds)
	local now = os.clock()
	local state = movement[humanoid]
	local isNew = (state == nil)
	if isNew then
		state = { base = humanoid.WalkSpeed, slowUntil = 0, slowFactor = 1, stunUntil = 0 }
		movement[humanoid] = state
	end
	if slowSeconds > 0 then
		state.slowUntil = math.max(state.slowUntil, now + slowSeconds)
		state.slowFactor = slowFactor
	end
	if stunSeconds > 0 then
		state.stunUntil = math.max(state.stunUntil, now + stunSeconds)
	end
	if not isNew then
		return -- the loop below is already running for this Humanoid
	end
	task.spawn(function()
		while humanoid.Parent and humanoid.Health > 0 do
			local t = os.clock()
			if t >= state.slowUntil and t >= state.stunUntil then
				break
			end
			local speed = state.base
			if t < state.slowUntil then
				speed = speed * state.slowFactor
			end
			if t < state.stunUntil then
				speed = 0
			end
			humanoid.WalkSpeed = speed
			task.wait(0.1)
		end
		humanoid.WalkSpeed = state.base
		movement[humanoid] = nil
	end)
end`;

local function startLoops(tool, isActive)
	local pulses, auras, colorful, arcs = {}, {}, {}, {}
	local rainbowSpeed = tool:GetAttribute("RainbowSpeed")
	for _, inst in ipairs(tool:GetDescendants()) do
		if inst:IsA("PointLight") then
			if inst:GetAttribute("Pulse") then
				table.insert(pulses, { inst = inst, base = inst.Brightness, speed = inst:GetAttribute("Pulse") })
			end
			if rainbowSpeed then
				table.insert(colorful, { inst = inst, kind = "light", original = inst.Color })
			end
		elseif inst:IsA("BasePart") then
			if inst:GetAttribute("AuraPulse") then
				table.insert(auras, { inst = inst, base = inst.Transparency, speed = inst:GetAttribute("AuraPulse") })
			end
			if rainbowSpeed and inst:GetAttribute("Rainbow") then
				table.insert(colorful, { inst = inst, kind = "part", original = inst.Color })
			end
		elseif inst:IsA("Trail") then
			if rainbowSpeed then
				table.insert(colorful, { inst = inst, kind = "trail", original = inst.Color })
			end
		elseif inst:IsA("Beam") then
			if inst:GetAttribute("Arc") then
				table.insert(arcs, inst)
			end
		end
	end
	if #pulses + #auras + #colorful + #arcs == 0 then
		return
	end

	task.spawn(function()
		local startTime = os.clock()
		while isActive() do
			local t = os.clock() - startTime
			for _, p in ipairs(pulses) do
				p.inst.Brightness = p.base * (0.7 + 0.3 * math.sin(t * p.speed * 2 * math.pi))
			end
			for _, a in ipairs(auras) do
				a.inst.Transparency = math.clamp(a.base + 0.18 * math.sin(t * a.speed * 2 * math.pi), 0, 1)
			end
			if rainbowSpeed then
				local color = Color3.fromHSV((t * rainbowSpeed) % 1, 0.85, 1)
				for _, c in ipairs(colorful) do
					if c.kind == "trail" then
						c.inst.Color = ColorSequence.new(color)
					else
						c.inst.Color = color
					end
				end
			end
			for _, beam in ipairs(arcs) do
				if math.random() < beam:GetAttribute("ArcSpeed") / 20 then
					local wild = beam:GetAttribute("Arc")
					beam.CurveSize0 = (math.random() * 2 - 1) * wild
					beam.CurveSize1 = (math.random() * 2 - 1) * wild
					beam.Enabled = math.random() < 0.85
				end
			end
			task.wait(0.05)
		end
		-- sword put away: restore everything
		for _, p in ipairs(pulses) do
			p.inst.Brightness = p.base
		end
		for _, a in ipairs(auras) do
			a.inst.Transparency = a.base
		end
		for _, c in ipairs(colorful) do
			if c.kind == "trail" then
				c.inst.Color = ColorSequence.new(c.original.Keypoints[1].Value)
			else
				c.inst.Color = c.original
			end
		end
	end)
end`;

		mover.VectorVelocity = look * WAVE.speed

			wave:SetNetworkOwner(nil)

			overlap.FilterType = Enum.RaycastFilterType.Exclude
			overlap.FilterDescendantsInstances = { character, wave }
			local rays = RaycastParams.new()
			rays.FilterType = Enum.RaycastFilterType.Exclude

local function setupCombat(tool)
	local handle = tool:WaitForChild("Handle")
	local hitbox = tool:WaitForChild("Hitbox")
	local baseGrip = tool.Grip

	local character, humanoid, root, player
	local equipped = false
	local session = 0 -- changes on every equip / unequip so old loops know when to stop
	local activeSwings = 0
	local lastSwing = -math.huge
	local comboStep = 0
	local lastComboTime = 0
	local diedConnection

	-- reads a stat; the tool's Attributes win over the defaults in STATS
	local function stat(name)
		local value = tool:GetAttribute(name)
		if value == nil then
			value = STATS[name]
		end
		return value
	end

	local function playSound(name)
		local sound = handle:FindFirstChild(name)
		if sound then
			sound.TimePosition = 0
			sound:Play()
		end
	end
${A ? E.animServer(A) : ''}
	-- effects that react to the sword being used (their "Trigger" attribute says when)
	local swingFx, burstFx, equipFx, hitFx = {}, {}, {}, {}
	for _, inst in ipairs(tool:GetDescendants()) do
		local trigger = inst:GetAttribute("Trigger")
		if trigger == "swing" then
			table.insert(swingFx, inst)
		elseif trigger == "burst" then
			table.insert(burstFx, inst)
		elseif trigger == "equip" then
			table.insert(equipFx, inst)
		elseif trigger == "hit" then
			table.insert(hitFx, inst)
		end
	end

	local function setEnabled(list, on)
		for _, inst in ipairs(list) do
			inst.Enabled = on
		end
	end

	local function emit(list)
		for _, inst in ipairs(list) do
			inst:Emit(inst:GetAttribute("Count") or 12)
		end
	end

	-- puts a burst of the "hit" particles on whoever you just hit
	local function spawnHitFx(targetRoot)
		if #hitFx == 0 then
			return
		end
		local spot = Instance.new("Attachment")
		spot.Name = "SwordHitFx"
		spot.Parent = targetRoot
		for _, template in ipairs(hitFx) do
			local copy = template:Clone()
			copy.Enabled = false
			copy.Parent = spot
			copy:Emit(copy:GetAttribute("Count") or 16)
		end
		Debris:AddItem(spot, 3)
	end

	local function canHurt(model)
		local otherPlayer = Players:GetPlayerFromCharacter(model)
		if otherPlayer and player then
			if otherPlayer == player then
				return false
			end
			if not stat("FriendlyFire") and player.Team ~= nil and otherPlayer.Team == player.Team then
				return false
			end
		end
		return true
	end

	-- one confirmed hit: damage, kill credit, sounds and every enchantment
	local function strike(targetHumanoid, model, hitPart, damage)
		local targetRoot = model:FindFirstChild("HumanoidRootPart") or hitPart
		if player then
			local tag = Instance.new("ObjectValue")
			tag.Name = "creator"
			tag.Value = player
			tag.Parent = targetHumanoid
			Debris:AddItem(tag, 2)
		end
		targetHumanoid:TakeDamage(damage)
		playSound("HitSound")
		spawnHitFx(targetRoot)
		for name, enchant in pairs(Enchants) do
			local ok, err = pcall(enchant, {
				tool = tool,
				attacker = character,
				attackerHumanoid = humanoid,
				attackerRoot = root,
				target = model,
				targetHumanoid = targetHumanoid,
				targetRoot = targetRoot,
				damage = damage,
			})
			if not ok then
				warn("[SwordForge] enchantment '" .. name .. "' failed: " .. tostring(err))
			end
		end
	end

	-- strikes every Humanoid inside a box (each one only once per swing)
	local function scan(cframe, size, params, alreadyHit, damage)
		for _, part in ipairs(workspace:GetPartBoundsInBox(cframe, size, params)) do
			local targetHumanoid, model = humanoidFromPart(part)
			if targetHumanoid and model ~= character and not alreadyHit[targetHumanoid] and targetHumanoid.Health > 0 and canHurt(model) then
				alreadyHit[targetHumanoid] = true
				strike(targetHumanoid, model, part, damage)
			end
		end
	end
`;

    mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: (a) => Math.hypot(a[0], a[1], a[2]),
    norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
    lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
  };
  function perspective(fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
  }
  function lookAt(eye, center, up) {
    const z = V.norm(V.sub(eye, center));
    const x = V.norm(V.cross(up, z));
    const y = V.cross(z, x);
    return new Float32Array([x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -V.dot(x, eye), -V.dot(y, eye), -V.dot(z, eye), 1]);
  }
  function mul4(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) {
      for (let r = 0; r < 4; r++) {
        o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
      }
    }
    return o;
  }
  /* row-major 3x3 (like model.js) -> column-major for uniformMatrix3fv */
  const toCol3 = (R) => new Float32Array([R[0], R[3], R[6], R[1], R[4], R[7], R[2], R[5], R[8]]);

  /* ------------------------------------------------------------------- meshes */
  function MeshBuilder() { this.pos = []; this.nrm = []; this.idx = []; }
  MeshBuilder.prototype.vert = function (p, n) {
    this.pos.push(p[0], p[1], p[2]);
    this.nrm.push(n[0], n[1], n[2]);
    return this.pos.length / 3 - 1;
  };
  // flat triangle, wound so the geometric normal agrees with n
  MeshBuilder.prototype.tri = function (a, b, c, n) {
    if (V.dot(V.cross(V.sub(b, a), V.sub(c, a)), n) < 0) { const t = b; b = c; c = t; }
    this.idx.push(this.vert(a, n), this.vert(b, n), this.vert(c, n));
  };
  MeshBuilder.prototype.quad = function (a, b, c, d, n) { this.tri(a, b, c, n); this.tri(a, c, d, n); };
  // smooth triangle with per-vertex normals
  MeshBuilder.prototype.tris = function (pa, na, pb, nb, pc, nc) {
    const n = [na[0] + nb[0] + nc[0], na[1] + nb[1] + nc[1], na[2] + nb[2] + nc[2]];
    if (V.dot(V.cross(V.sub(pb, pa), V.sub(pc, pa)), n) < 0) { let t = pb; pb = pc; pc = t; t = nb; nb = nc; nc = t; }
    this.idx.push(this.vert(pa, na), this.vert(pb, nb), this.vert(pc, nc));
  };
  MeshBuilder.prototype.done = function () {
    return { pos: new Float32Array(this.pos), nrm: new Float32Array(this.nrm), idx: new Uint16Array(this.idx) };
  };

  function boxMesh() {
    const m = new MeshBuilder();
    const h = 0.5;
    const faces = [
      [[1, 0, 0], [[h, -h, -h], [h, h, -h], [h, h, h], [h, -h, h]]],
      [[-1, 0, 0], [[-h, -h, -h], [-h, h, -h], [-h, h, h], [-h, -h, h]]],
      [[0, 1, 0], [[-h, h, -h], [h, h, -h], [h, h, h], [-h, h, h]]],
      [[0, -1, 0], [[-h, -h, -h], [h, -h, -h], [h, -h, h], [-h, -h, h]]],
      [[0, 0, 1], [[-h, -h, h], [h, -h, h], [h, h, h], [-h, h, h]]],
      [[0, 0, -1], [[-h, -h, -h], [h, -h, -h], [h, h, -h], [-h, h, -h]]],
    ];
    faces.forEach(([n, q]) => m.quad(q[0], q[1], q[2], q[3], n));
    return m.done();
  }

  /* Roblox WedgePart: triangle in the Y/Z plane (extruded along X):
     front-bottom (-Y,-Z), back-bottom (-Y,+Z), back-top (+Y,+Z). `flip` mirrors it (see "Flip wedges"). */
  function wedgeMesh(flip) {
    const m = new MeshBuilder();
    const h = 0.5;
    const s = flip ? -1 : 1;                       // mirror Z
    const FB = (x) => [x, -h, -h * s], BB = (x) => [x, -h, h * s], BT = (x) => [x, h, h * s];
    m.quad(FB(-h), FB(h), BB(h), BB(-h), [0, -1, 0]);                   // bottom
    m.quad(BB(-h), BB(h), BT(h), BT(-h), [0, 0, s]);                    // back (vertical face)
    const slope = V.norm([0, 1, -s]);
    m.quad(FB(-h), FB(h), BT(h), BT(-h), slope);                        // slope
    m.tri(FB(-h), BB(-h), BT(-h), [-1, 0, 0]);                          // sides
    m.tri(FB(h), BB(h), BT(h), [1, 0, 0]);
    return m.done();
  }

  /* cylinder along X, radius 0.5 (Roblox cylinder), length 1 */
  function cylinderMesh(seg) {
    const m = new MeshBuilder();
    const h = 0.5;
    for (let i = 0; i < seg; i++) {
      const a0 = (i / seg) * Math.PI * 2, a1 = ((i + 1) / seg) * Math.PI * 2;
      const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
      const n0 = [0, c0, s0], n1 = [0, c1, s1];
      const p00 = [-h, 0.5 * c0, 0.5 * s0], p01 = [h, 0.5 * c0, 0.5 * s0], p10 = [-h, 0.5 * c1, 0.5 * s1], p11 = [h, 0.5 * c1, 0.5 * s1];
      m.tris(p00, n0, p01, n0, p11, n1);
      m.tris(p00, n0, p11, n1, p10, n1);
      m.tri([h, 0, 0], p01, p11, [1, 0, 0]);
      m.tri([-h, 0, 0], p00, p10, [-1, 0, 0]);
    }
    return m.done();
  }

  function sphereMesh(lat, lon) {
    const m = new MeshBuilder();
    const P = (i, j) => {
      const th = (i / lat) * Math.PI, ph = (j / lon) * Math.PI * 2;
      const n = [Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph)];
      return [[n[0] * 0.5, n[1] * 0.5, n[2] * 0.5], n];
    };
    for (let i = 0; i < lat; i++) {
      for (let j = 0; j < lon; j++) {
        const a = P(i, j), b = P(i + 1, j), c = P(i + 1, j + 1), d = P(i, j + 1);
        if (i > 0) m.tris(a[0], a[1], b[0], b[1], d[0], d[1]);
        if (i < lat - 1) m.tris(b[0], b[1], c[0], c[1], d[0], d[1]);
      }
    }
    return m.done();
  }

  /* ------------------------------------------------------------------ shaders */
  const PREC = 'precision highp float;\n';
  const SRC = {};

  SRC.meshVS = `
attribute vec3 aPos; attribute vec3 aNrm;
uniform mat4 uVP; uniform vec3 uPos; uniform mat3 uRot; uniform vec3 uSize;
varying vec3 vN; varying vec3 vP;
void main() {
  vec3 wp = uPos + uRot * (aPos * uSize);
  vN = normalize(uRot * (aNrm / uSize));
  vP = wp;
  gl_Position = uVP * vec4(wp, 1.0);
}`;
  SRC.meshFS = PREC + `
varying vec3 vN; varying vec3 vP;
uniform vec3 uCam, uLightDir, uLightCol, uSky, uGround, uColor, uPLPos, uPLCol;
uniform float uSpec, uShin, uMetal, uEmit, uAlpha, uRim, uPLRange, uFlat, uFlash;
void main() {
  if (uFlat > 0.5) { gl_FragColor = vec4(uColor, uAlpha); return; }
  vec3 N = normalize(vN);
  vec3 V = normalize(uCam - vP);
  vec3 L = normalize(uLightDir);
  float ndl = max(dot(N, L), 0.0);
  vec3 hemi = mix(uGround, uSky, N.y * 0.5 + 0.5);
  vec3 L2 = normalize(vec3(0.7, 0.15, 0.7));
  float ndl2 = max(dot(N, L2), 0.0);
  vec3 base = uColor;
  vec3 diffuse = base * (hemi + uLightCol * ndl + vec3(0.55, 0.62, 0.8) * ndl2 * 0.38);
  vec3 toL = uPLPos - vP;
  float d = length(toL);
  float att = clamp(1.0 - d / max(uPLRange, 0.01), 0.0, 1.0);
  att *= att;
  diffuse += base * uPLCol * att * max(dot(N, toL / max(d, 0.001)), 0.0) * 1.4;
  vec3 H = normalize(L + V);
  float sp = pow(max(dot(N, H), 0.0), uShin) * uSpec;
  vec3 specCol = mix(vec3(1.0), base, uMetal);
  vec3 R = reflect(-V, N);
  float horizon = pow(1.0 - abs(R.y), 4.0);
  vec3 env = mix(uGround * 0.9, uSky * 1.7 + vec3(0.16), clamp(R.y * 0.5 + 0.5, 0.0, 1.0)) + vec3(0.5, 0.56, 0.66) * horizon * 0.7;
  float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
  vec3 lit = diffuse * (1.0 - 0.4 * uMetal)
           + uLightCol * sp * specCol * 1.3
           + env * specCol * uSpec * (0.3 + 0.6 * uMetal) * (0.6 + fres)
           + fres * uRim * (uSky + vec3(0.15));
  lit += uPLCol * att * sp * 0.6;
  vec3 col = mix(lit, base * 1.02 + vec3(0.02), uEmit);
